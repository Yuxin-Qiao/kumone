name: 🐛 Bug 报告 (Bug Report)
description: 提交程序错误、闪退、安装或兼容性问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告。Kumone 的下游客户端通过 CI 自动发布，真实设备兼容性主要依赖社区反馈；请尽量完整填写环境信息。

  - type: dropdown
    id: platform
    attributes:
      label: 发生问题的平台 (Platform)
      options:
        - "macOS (SwiftUI 原生版 / upstream)"
        - "Windows (Tauri 2 + Rust)"
        - "Android (Jetpack Compose + Rust)"
        - "Linux (Tauri 2 + Rust)"
        - "Web / PWA / Docker"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 客户端版本号 (App Version)
      description: 请填写实际运行的 Kumone 版本。
      placeholder: 例如 0.2.5
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: 操作系统版本 (OS Version)
      placeholder: 例如 Windows 11 24H2 / Android 16 / Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: CPU 架构 (Architecture)
      options:
        - "x86_64 / x64"
        - "arm64 / aarch64"
        - "其他 / 不确定"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: 安装包 / 使用方式 (Package)
      options:
        - "Windows NSIS (.exe)"
        - "Android APK (.apk)"
        - "Android AAB / Play-compatible bundle"
        - "Linux AppImage"
        - "Linux Debian package (.deb)"
        - "Linux RPM (.rpm)"
        - "Web / PWA / Docker"
        - "macOS upstream build"
        - "其他 / 不确定"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 受影响功能 (Area)
      options:
        - "安装 / 启动 / 更新"
        - "登录 / 账号"
        - "播放 / 队列"
        - "搜索"
        - "歌词"
        - "灰色歌曲 / Unblock"
        - "界面 / 交互"
        - "性能 / 资源占用"
        - "其他"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度 (Severity)
      options:
        - "Crash / 无法启动"
        - "Blocker / 核心功能不可用"
        - "Degraded / 功能可用但明显异常"
        - "Minor / 轻微问题"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述 (Bug Description)
      description: 请说明实际行为与预期行为。
      placeholder: 在点击……时，实际出现……；预期应该……
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 重现步骤 (Steps to Reproduce)
      placeholder: |
        1. 打开 Kumone
        2. ……
        3. ……
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或报错截图 (Logs & Screenshots)
      description: 可粘贴控制台输出、错误信息或拖入截图。请先删除账号凭据、Cookie、Token 等敏感信息。
    validations:
      required: false
