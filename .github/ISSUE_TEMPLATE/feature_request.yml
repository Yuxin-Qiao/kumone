name: 💡 功能建议 (Feature Request)
description: 为 Kumone 提出新的功能构想或体验改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎为 Kumone 提出任何功能建议与设计想法！

  - type: dropdown
    id: platform
    attributes:
      label: 涉及的平台 (Target Platform)
      options:
        - "全平台通用 (All Platforms)"
        - "macOS"
        - "Windows"
        - "Linux"
        - "Web / PWA"
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: 功能诉求描述 (Feature Description)
      description: 您希望增加什么新特性？它能解决什么痛点？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或参考 (Alternatives & References)
      description: 您考虑过哪些替代方案，或是否有其他开源播放器的交互可供参考？
    validations:
      required: false
