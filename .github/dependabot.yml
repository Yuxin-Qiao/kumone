version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain the new shared Rust core during migration.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain the legacy Windows / Linux Electron dependencies until Tauri replaces them.
  - package-ecosystem: "npm"
    directory: "/windows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Web player dependencies.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
