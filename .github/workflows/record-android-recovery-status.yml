name: Record Android Recovery Release Status

on:
  workflow_run:
    workflows: ["Recover Signed Android Downstream Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Record recovery result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/release-status
          jq -n \
            --argjson run_id "$RUN_ID" \
            --arg url "$RUN_URL" \
            --arg status "$RUN_STATUS" \
            --arg conclusion "$RUN_CONCLUSION" \
            --arg head_sha "$HEAD_SHA" \
            '{run_id:$run_id,url:$url,status:$status,conclusion:$conclusion,head_sha:$head_sha}' \
            > .github/release-status/android-recovery.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-status/android-recovery.json
          git commit -m "ci(status): record Android recovery release #$RUN_ID" || exit 0
          git push origin HEAD:main
