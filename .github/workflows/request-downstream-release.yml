name: Request Upstream-Aligned Downstream Release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-request.json"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Resolve upstream version and dispatch release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE=.github/release-request.json
          if [[ ! -f "$REQUEST_FILE" ]]; then
            echo "::error::Missing $REQUEST_FILE"
            exit 1
          fi

          SOURCE_REF=$(jq -r '.source_ref // "refactor/rust-core-windows-android"' "$REQUEST_FILE")
          PRERELEASE=$(jq -r '.prerelease // true' "$REQUEST_FILE")

          CHANGELOG=$(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/missuo/kumone/main/CHANGELOG.md)
          VERSION=$(printf '%s\n' "$CHANGELOG" \
            | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' \
            | head -n 1)

          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not resolve the latest upstream version from missuo/kumone CHANGELOG.md"
            exit 1
          fi

          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "### Downstream release request"
            echo "- Upstream: missuo/kumone"
            echo "- Version: **$VERSION**"
            echo "- Source ref: \`$SOURCE_REF\`"
            echo "- Prerelease: **$PRERELEASE**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch downstream release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ steps.request.outputs.source_ref }}
          VERSION: ${{ steps.request.outputs.version }}
          PRERELEASE: ${{ steps.request.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-downstream.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="$SOURCE_REF" \
            -f version="$VERSION" \
            -f prerelease="$PRERELEASE"
          echo "Dispatched downstream-v$VERSION" >> "$GITHUB_STEP_SUMMARY"
