name: Validate Downstream Release Request

on:
  push:
    branches: [main]
    paths:
      - ".github/release-request.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: Validate exact-source release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate request against source and upstream
        id: release
        shell: bash
        run: |
          set -euo pipefail

          REQUEST_FILE=.github/release-request.json
          [[ -f "$REQUEST_FILE" ]] || {
            echo "::error::Missing $REQUEST_FILE"
            exit 1
          }

          SOURCE_SHA=$(jq -r '.source_ref // empty' "$REQUEST_FILE")
          TAG_SUFFIX=$(jq -r '.tag_suffix // ""' "$REQUEST_FILE")
          PRERELEASE=$(jq -r 'if has("prerelease") then .prerelease else true end' "$REQUEST_FILE")

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_ref must be a full 40-character commit SHA"
            exit 1
          }
          [[ -z "$TAG_SUFFIX" || "$TAG_SUFFIX" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Invalid tag_suffix: $TAG_SUFFIX"
            exit 1
          }
          [[ "$PRERELEASE" == "true" || "$PRERELEASE" == "false" ]] || {
            echo "::error::prerelease must be boolean"
            exit 1
          }

          git fetch --no-tags origin main
          git cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null || {
            echo "::error::source_ref is not a commit available in this repository"
            exit 1
          }
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "::error::Release source must already be part of main history"
            exit 1
          }

          SOURCE_VERSION=$(git show "$SOURCE_SHA:CHANGELOG.md" \
            | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' \
            | head -n 1)
          UPSTREAM_VERSION=$(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/missuo/kumone/main/CHANGELOG.md \
            | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' \
            | head -n 1)

          [[ -n "$SOURCE_VERSION" && -n "$UPSTREAM_VERSION" ]] || {
            echo "::error::Could not resolve source/upstream version"
            exit 1
          }
          if [[ "$SOURCE_VERSION" != "$UPSTREAM_VERSION" ]]; then
            [[ "$PRERELEASE" == "true" && "$TAG_SUFFIX" =~ ^rc[._-] ]] || {
              echo "::error::A source version behind upstream requires prerelease=true and an explicit rc tag suffix"
              exit 1
            }
            LATEST_VERSION=$(printf '%s\n%s\n' "$SOURCE_VERSION" "$UPSTREAM_VERSION" | sort -V | tail -n 1)
            [[ "$LATEST_VERSION" == "$UPSTREAM_VERSION" ]] || {
              echo "::error::Source version $SOURCE_VERSION is newer than upstream $UPSTREAM_VERSION"
              exit 1
            }
            echo "::warning::Preparing historical source $SOURCE_VERSION as prerelease $TAG_SUFFIX while upstream is $UPSTREAM_VERSION"
          fi

          RELEASE_TAG="downstream-v$SOURCE_VERSION"
          [[ -z "$TAG_SUFFIX" ]] || RELEASE_TAG="$RELEASE_TAG-$TAG_SUFFIX"

          echo "source_ref=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$SOURCE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=$TAG_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          {
            echo "### Downstream release policy gate"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Source trust: **main ancestor verified**"
            echo "- App version: **$SOURCE_VERSION**"
            echo "- Upstream version: **$UPSTREAM_VERSION**"
            echo "- Version policy: **historical source allowed only for explicit rc prerelease; stable releases remain exact-upstream gated**"
            echo "- Requested tag: \`$RELEASE_TAG\`"
            echo "- Prerelease: **$PRERELEASE**"
            echo "- Next step: **automatic downstream build + publication**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch downstream release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ steps.release.outputs.source_ref }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG_SUFFIX: ${{ steps.release.outputs.tag_suffix }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-downstream.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="$SOURCE_REF" \
            -f version="$VERSION" \
            -f tag_suffix="$TAG_SUFFIX" \
            -f prerelease="$PRERELEASE"
          echo "Dispatched release-downstream.yml for $VERSION${TAG_SUFFIX:+-$TAG_SUFFIX}" >> "$GITHUB_STEP_SUMMARY"
