name: Request Upstream-Aligned Downstream Release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-request.json"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    name: Resolve upstream version and dispatch release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE=.github/release-request.json
          if [[ ! -f "$REQUEST_FILE" ]]; then
            echo "::error::Missing $REQUEST_FILE"
            exit 1
          fi

          SOURCE_REF=$(jq -r '.source_ref // "main"' "$REQUEST_FILE")
          PRERELEASE=$(jq -r '.prerelease // true' "$REQUEST_FILE")

          CHANGELOG=$(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/missuo/kumone/main/CHANGELOG.md)
          VERSION=$(printf '%s\n' "$CHANGELOG" \
            | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' \
            | head -n 1)

          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not resolve the latest upstream version from missuo/kumone CHANGELOG.md"
            exit 1
          fi

          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "### Downstream release request"
            echo "- Upstream: missuo/kumone"
            echo "- Version: **$VERSION**"
            echo "- Source ref: \`$SOURCE_REF\`"
            echo "- Prerelease: **$PRERELEASE**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch downstream release
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ steps.request.outputs.source_ref }}
          VERSION: ${{ steps.request.outputs.version }}
          PRERELEASE: ${{ steps.request.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release-downstream.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="$SOURCE_REF" \
            -f version="$VERSION" \
            -f prerelease="$PRERELEASE"

          RUN_JSON=""
          for _ in $(seq 1 12); do
            RUN_JSON=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release-downstream.yml \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt,status,conclusion,url,headSha \
              --jq '[.[] | select(.createdAt >= "'"$DISPATCHED_AT"'")] | sort_by(.createdAt) | reverse | .[0] // empty')
            if [[ -n "$RUN_JSON" && "$RUN_JSON" != "null" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$RUN_JSON" || "$RUN_JSON" == "null" ]]; then
            echo "::error::Release was dispatched but its workflow run could not be resolved"
            exit 1
          fi

          mkdir -p .github/release-status
          printf '%s\n' "$RUN_JSON" | jq \
            --arg version "$VERSION" \
            --arg source_ref "$SOURCE_REF" \
            '. + {version:$version,source_ref:$source_ref}' \
            > .github/release-status/active.json
          RUN_ID=$(jq -r '.databaseId' .github/release-status/active.json)
          RUN_URL=$(jq -r '.url' .github/release-status/active.json)
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "Dispatched downstream-v$VERSION: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist active release run
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-status/active.json
          git commit -m "ci(status): record active downstream release #${{ steps.dispatch.outputs.run_id }}"
          git pull --rebase origin main
          git push origin HEAD:main
