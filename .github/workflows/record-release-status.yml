name: Record Downstream Release Status

on:
  workflow_run:
    workflows:
      - "Validate Downstream Release Request"
      - "Downstream Windows + Android Release"
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record workflow result
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/release-status
          if [[ "$WORKFLOW_NAME" == "Downstream Windows + Android Release" ]]; then
            FILE=.github/release-status/release.json
          else
            FILE=.github/release-status/dispatcher.json
          fi
          jq -n \
            --arg workflow "$WORKFLOW_NAME" \
            --argjson run_id "$RUN_ID" \
            --argjson run_number "$RUN_NUMBER" \
            --arg conclusion "$CONCLUSION" \
            --arg head_sha "$HEAD_SHA" \
            --arg url "$HTML_URL" \
            --arg updated_at "$UPDATED_AT" \
            '{workflow:$workflow,run_id:$run_id,run_number:$run_number,conclusion:$conclusion,head_sha:$head_sha,url:$url,updated_at:$updated_at}' \
            > "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(status): record $WORKFLOW_NAME #$RUN_NUMBER $CONCLUSION"
          git pull --rebase origin main
          git push origin HEAD:main
