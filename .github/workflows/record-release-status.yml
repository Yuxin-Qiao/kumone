name: Record Downstream Release Status

on:
  workflow_run:
    workflows:
      - "Validate Downstream Release Request"
      - "Downstream Windows + Linux + Android Release"
    types: [completed]
  workflow_dispatch:
    inputs:
      workflow_name:
        description: "Completed workflow name to record"
        required: true
        type: string
      run_id:
        description: "Completed workflow run ID"
        required: true
        type: string
      run_number:
        description: "Completed workflow run number"
        required: true
        type: string
      run_attempt:
        description: "Completed workflow run attempt"
        required: true
        type: string
      conclusion:
        description: "Completed workflow conclusion"
        required: true
        type: string
      head_sha:
        description: "Completed workflow head SHA"
        required: true
        type: string
      html_url:
        description: "Completed workflow URL"
        required: true
        type: string
      updated_at:
        description: "Completed workflow update timestamp"
        required: true
        type: string

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Record workflow result
        env:
          WORKFLOW_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || inputs.workflow_name }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
          RUN_NUMBER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_number || inputs.run_number }}
          RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.run_attempt }}
          CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || inputs.conclusion }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.head_sha }}
          HTML_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || inputs.html_url }}
          UPDATED_AT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.updated_at || inputs.updated_at }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/release-status

          if [[ "$WORKFLOW_NAME" == "Downstream Windows + Linux + Android Release" && "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            existing_run=$(jq -r '.run_id // empty' .github/release-status/release.json 2>/dev/null || true)
            if [[ "$existing_run" == "$RUN_ID" ]]; then
              echo "Release publish already recorded exact run $RUN_ID; preserving its source/version metadata." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if [[ "$WORKFLOW_NAME" == "Downstream Windows + Linux + Android Release" ]]; then
            REQUEST=.github/release-request.json
            SOURCE_REF=""
            TAG_SUFFIX=""
            PRERELEASE=""
            VERSION=""
            TAG=""

            if [[ -f "$REQUEST" ]]; then
              SOURCE_REF=$(jq -r '.source_ref // ""' "$REQUEST")
              TAG_SUFFIX=$(jq -r '.tag_suffix // ""' "$REQUEST")
              PRERELEASE=$(jq -r '.prerelease // false' "$REQUEST")
            fi

            if [[ -n "$SOURCE_REF" ]]; then
              git fetch origin "$SOURCE_REF" 2>/dev/null || true
              VERSION=$(git show "$SOURCE_REF:CHANGELOG.md" 2>/dev/null \
                | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' \
                | head -n 1 || true)
            fi

            if [[ -n "$VERSION" ]]; then
              TAG="downstream-v$VERSION"
              [[ -z "$TAG_SUFFIX" ]] || TAG="$TAG-$TAG_SUFFIX"
            fi

            jq -n \
              --arg workflow "$WORKFLOW_NAME" \
              --argjson run_id "$RUN_ID" \
              --argjson run_number "$RUN_NUMBER" \
              --argjson run_attempt "$RUN_ATTEMPT" \
              --arg status "completed" \
              --arg conclusion "$CONCLUSION" \
              --arg head_sha "$HEAD_SHA" \
              --arg source_ref "$SOURCE_REF" \
              --arg version "$VERSION" \
              --arg tag "$TAG" \
              --arg prerelease "$PRERELEASE" \
              --arg url "$HTML_URL" \
              --arg updated_at "$UPDATED_AT" \
              '{workflow:$workflow,run_id:$run_id,run_number:$run_number,run_attempt:$run_attempt,status:$status,conclusion:$conclusion,head_sha:$head_sha,source_ref:$source_ref,version:$version,tag:$tag,prerelease:$prerelease,url:$url,updated_at:$updated_at}' \
              > .github/release-status/release.json
            cp .github/release-status/release.json .github/release-status/active.json
            FILES=(.github/release-status/release.json .github/release-status/active.json)
          else
            jq -n \
              --arg workflow "$WORKFLOW_NAME" \
              --argjson run_id "$RUN_ID" \
              --argjson run_number "$RUN_NUMBER" \
              --argjson run_attempt "$RUN_ATTEMPT" \
              --arg conclusion "$CONCLUSION" \
              --arg head_sha "$HEAD_SHA" \
              --arg url "$HTML_URL" \
              --arg updated_at "$UPDATED_AT" \
              '{workflow:$workflow,run_id:$run_id,run_number:$run_number,run_attempt:$run_attempt,conclusion:$conclusion,head_sha:$head_sha,url:$url,updated_at:$updated_at}' \
              > .github/release-status/dispatcher.json
            FILES=(.github/release-status/dispatcher.json)
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(status): record $WORKFLOW_NAME #$RUN_NUMBER attempt $RUN_ATTEMPT $CONCLUSION"
          git pull --rebase origin main
          git push origin HEAD:main
