name: Sync Upstream & Auto Build

on:
  schedule:
    # 每 3 小时自动检查并同步上游更新
    - cron: '0 */3 * * *'
  # 支持在 GitHub Actions 页面随时手动一键触发
  workflow_dispatch:
    inputs:
      force_build:
        description: '是否无论是否有新提交，都强制触发 Windows & Android 构建'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream and Fetch
        run: |
          git remote add upstream https://github.com/missuo/kumone.git || git remote set-url upstream https://github.com/missuo/kumone.git
          git fetch upstream --tags --force

      - name: Sync Tags from Upstream
        id: sync_tags
        run: |
          LOCAL_TAGS=$(git tag -l)
          UPSTREAM_TAGS=$(git tag -l --sort=v:refname)
          NEW_TAGS=false

          # 检查是否有上游新标签需要推送到 origin
          for tag in $(git ls-remote --tags upstream | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '\^{}'); do
            if ! git tag -l | grep -q "^$tag$"; then
              echo "Found new upstream tag: $tag"
              git fetch upstream tag "$tag" --no-tags
              NEW_TAGS=true
            fi
          done

          echo "new_tags=$NEW_TAGS" >> $GITHUB_OUTPUT

      - name: Merge upstream/main into main
        id: merge
        run: |
          git checkout main
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          LOCAL_HEAD=$(git rev-parse HEAD)
          MERGE_BASE=$(git merge-base HEAD upstream/main)

          if [ "$UPSTREAM_HEAD" = "$MERGE_BASE" ]; then
            echo "Already up to date with upstream/main."
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "Merging upstream/main into main..."
            if git merge --no-edit upstream/main -m "chore(sync): merge upstream/main into main"; then
              echo "Merge successful."
              echo "updated=true" >> $GITHUB_OUTPUT
            else
              echo "Merge conflict detected!"
              exit 1
            fi
          fi

      - name: Push branch and tags to origin
        run: |
          git push origin main --tags

      - name: Trigger Downstream Multi-Platform Matrix Builds (Windows, Android, Linux, Web)
        if: steps.merge.outputs.updated == 'true' || steps.sync_tags.outputs.new_tags == 'true' || inputs.force_build == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Triggering simultaneous Multi-Platform builds (Windows, Android, Linux, Web) (Target Tag: $LATEST_TAG)..."
          if [ -n "$LATEST_TAG" ]; then
            gh workflow run build-windows.yml -f tag="$LATEST_TAG" || gh workflow run build-windows.yml || true
            gh workflow run build-android.yml -f tag="$LATEST_TAG" || gh workflow run build-android.yml || true
            gh workflow run build-linux.yml -f tag="$LATEST_TAG" || gh workflow run build-linux.yml || true
          else
            gh workflow run build-windows.yml || true
            gh workflow run build-android.yml || true
            gh workflow run build-linux.yml || true
          fi
          gh workflow run build-web.yml || true

      - name: Notify on Conflict
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ [自动同步告警] 上游代码合并出现冲突" \
            --body "GitHub Actions 在自动同步上游 \`missuo/kumone\` 代码时遇到冲突，请在本地拉取代码并手动解决冲突后推送到 \`main\` 分支。" || true
