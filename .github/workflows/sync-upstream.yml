name: Upstream Sync PR

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Create/update the sync PR even when upstream SHA is unchanged"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Prepare compatibility-gated upstream PR
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      branch: ${{ steps.detect.outputs.branch }}
    steps:
      - name: Checkout downstream main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/missuo/kumone.git || \
            git remote set-url upstream https://github.com/missuo/kumone.git
          git fetch upstream main --no-tags

      - name: Detect upstream delta
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_HEAD=$(git rev-parse HEAD)
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD upstream/main)
          BRANCH="automation/upstream-sync"

          echo "local_head=$LOCAL_HEAD" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"
          echo "merge_base=$MERGE_BASE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [[ "$UPSTREAM_HEAD" == "$MERGE_BASE" && "${{ inputs.force || false }}" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Downstream already contains upstream $UPSTREAM_HEAD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create clean sync branch
        if: steps.detect.outputs.changed == 'true'
        run: git switch -C "${{ steps.detect.outputs.branch }}" main

      - name: Merge upstream into sync branch
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge --no-ff --no-edit upstream/main -m "chore(upstream): sync missuo/kumone"; then
            git merge --abort || true
            {
              echo "## Upstream sync blocked by merge conflicts"
              echo
              echo "Upstream: \`${{ steps.detect.outputs.upstream_head }}\`"
              echo
              echo "No downstream main commit was changed. Resolve the conflict on a dedicated branch."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Generate compatibility report
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/upstream-sync
          REPORT=docs/upstream-sync/latest.md
          FILES=$(mktemp)
          git diff --name-only "${{ steps.detect.outputs.merge_base }}..upstream/main" > "$FILES"

          api=$(grep -Ec '^Sources/Kumone/Core/API/' "$FILES" || true)
          models=$(grep -Ec '^Sources/Kumone/Core/Models/' "$FILES" || true)
          player=$(grep -Ec '^Sources/Kumone/Core/Player/' "$FILES" || true)
          features=$(grep -Ec '^Sources/Kumone/Features/' "$FILES" || true)
          design=$(grep -Ec '^Sources/Kumone/DesignSystem/' "$FILES" || true)
          docs=$(grep -Ec '(^README|^docs/|CHANGELOG)' "$FILES" || true)
          total=$(wc -l < "$FILES" | tr -d ' ')

          {
            echo "# Upstream Compatibility Report"
            echo
            echo "- Upstream: \`missuo/kumone\`"
            echo "- Upstream SHA: \`${{ steps.detect.outputs.upstream_head }}\`"
            echo "- Previous merge base: \`${{ steps.detect.outputs.merge_base }}\`"
            echo "- Changed files: **$total**"
            echo
            echo "## Classification"
            echo
            echo "| Area | Files | Required downstream review |"
            echo "| --- | ---: | --- |"
            echo "| Core/API | $api | Rust API/crypto parity |"
            echo "| Core/Models | $models | Rust model parity |"
            echo "| Core/Player | $player | Rust queue + native playback adapters |"
            echo "| Features | $features | Windows/Android product parity |"
            echo "| DesignSystem | $design | Windows/Android UI parity |"
            echo "| Docs/changelog | $docs | Usually no code port |"
            echo
            echo "## Changed upstream files"
            echo
            sed 's/^/- `&`/' "$FILES"
            echo
            echo "## Merge policy"
            echo
            echo "Do not merge this PR until required downstream CI is green and semantic Core/API changes have been ported to \`kumone-core\`."
          } > "$REPORT"

          git add "$REPORT"
          git commit -m "chore(upstream): update compatibility report" || true

      - name: Push sync branch
        if: steps.detect.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:"${{ steps.detect.outputs.branch }}"

      - name: Create or update sync PR
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.detect.outputs.branch }}
          UPSTREAM_HEAD: ${{ steps.detect.outputs.upstream_head }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(mktemp)
          cat > "$BODY" <<EOF
          Automated compatibility-gated sync from \`missuo/kumone\`.

          Upstream SHA: \`$UPSTREAM_HEAD\`

          Review \`docs/upstream-sync/latest.md\` before merging. This PR must not bypass Rust Core, Windows, and (once present) Android validation.
          EOF

          NUMBER=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [[ -n "$NUMBER" ]]; then
            gh pr edit "$NUMBER" --title "chore(upstream): sync missuo/kumone" --body-file "$BODY"
          else
            gh pr create --head "$BRANCH" --base main \
              --title "chore(upstream): sync missuo/kumone" \
              --body-file "$BODY"
          fi

      - name: Explicitly dispatch downstream CI
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.detect.outputs.branch }}
        shell: bash
        run: |
          # PRs created by GITHUB_TOKEN may not recursively trigger pull_request workflows.
          # Explicit dispatch keeps validation deterministic.
          gh workflow run ci-core.yml --ref "$BRANCH"
          gh workflow run ci-windows.yml --ref "$BRANCH"
          if gh workflow view ci-android.yml >/dev/null 2>&1; then
            gh workflow run ci-android.yml --ref "$BRANCH"
          fi
