name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-windows.yml"
      - "contracts/**"
      - "scripts/ci/validate-contracts.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tauri:
    name: Windows Tauri desktop shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            apps/windows/src-tauri

      - name: Test shared Rust core
        run: cargo test --manifest-path crates/kumone-core/Cargo.toml --all-targets

      - name: Test shared web UI
        run: npm test --prefix web

      - name: Validate shared state and release contracts
        run: python3 scripts/ci/validate-contracts.py

      - name: Check Tauri shell
        run: cargo check --manifest-path apps/windows/src-tauri/Cargo.toml

      - name: Clippy Tauri shell
        run: cargo clippy --manifest-path apps/windows/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build optimized Windows executable
        run: cargo build --release --manifest-path apps/windows/src-tauri/Cargo.toml

      - name: Enforce Windows binary size budget
        shell: pwsh
        run: |
          $path = "apps/windows/src-tauri/target/release/kumone-desktop.exe"
          if (-not (Test-Path $path)) { throw "Missing optimized Windows executable: $path" }
          $bytes = (Get-Item $path).Length
          $mib = [math]::Round($bytes / 1MB, 2)
          "### Windows size guard" >> $env:GITHUB_STEP_SUMMARY
          "- Optimized EXE: **$mib MiB**" >> $env:GITHUB_STEP_SUMMARY
          "- Stretch target: **10 MiB**" >> $env:GITHUB_STEP_SUMMARY
          "- Hard budget: **15 MiB**" >> $env:GITHUB_STEP_SUMMARY
          if ($bytes -gt 15MB) {
            throw "Windows optimized executable is $mib MiB, above the 15 MiB hard budget"
          }
          if ($bytes -gt 10MB) {
            Write-Warning "Windows optimized executable is $mib MiB; above the 10 MiB stretch target but within the 15 MiB hard budget"
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kumone-desktop-windows
          path: apps/windows/src-tauri/target/release/kumone-desktop.exe
          if-no-files-found: error
          retention-days: 7
