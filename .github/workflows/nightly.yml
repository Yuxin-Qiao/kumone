name: Nightly Protocol + API Smoke

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-protocol-api
  cancel-in-progress: true

jobs:
  smoke:
    name: NetEase protocol and live API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Validate Rust protocol vectors
        run: cargo test --manifest-path crates/kumone-core/Cargo.toml --all-targets

      - name: Validate live NetEase API behavior
        env:
          KUMONE_ALLOW_KNOWN_EXTERNAL_CHALLENGE: "1"
          KUMONE_LIVE_STATUS_FILE: ${{ runner.temp }}/kumone-live-status.json
        run: npm run test:live --prefix web -- --allow-known-external-challenge

      - name: Record success summary
        if: always()
        run: |
          status="failed"
          if [[ -f "$RUNNER_TEMP/kumone-live-status.json" ]]; then
            status="$(jq -r '.status // "failed"' "$RUNNER_TEMP/kumone-live-status.json")"
          fi
          {
            echo "## Kumone nightly smoke: $status"
            echo
            echo "- Rust weapi/eapi golden vectors: passed"
            echo "- Web/PWA protocol tests: passed"
            case "$status" in
              all_passed)
                echo "- Live NetEase search/playlist/lyrics/audio/login smoke checks: passed"
                ;;
              known_external_challenge)
                echo "- Live NetEase probe: known external challenge/rate limit (not a code regression)"
                ;;
              *)
                echo "- Live NetEase probe: failed; inspect the job log"
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
