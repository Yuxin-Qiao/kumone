name: Zero-touch release recovery

on:
  workflow_run:
    workflows:
      - Downstream Windows + Linux + Android Release
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed downstream release run to recover"
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  id-token: write
  attestations: write

concurrency:
  group: zero-touch-release-recovery
  cancel-in-progress: false

jobs:
  inspect:
    name: Retry transient builds or select artifact recovery
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      recover: ${{ steps.inspect.outputs.recover }}
      original_run_id: ${{ steps.inspect.outputs.original_run_id }}
      source_sha: ${{ steps.inspect.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      EVENT_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - id: inspect
        name: Inspect immutable failed run and artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "recover=false" >> "$GITHUB_OUTPUT"
          [[ "$EVENT_RUN_ID" =~ ^[0-9]+$ ]]
          RUN=$(gh api "repos/$REPO/actions/runs/$EVENT_RUN_ID")
          NAME=$(jq -r '.name // ""' <<<"$RUN")
          CONCLUSION=$(jq -r '.conclusion // ""' <<<"$RUN")
          ATTEMPT=$(jq -r '.run_attempt // 1' <<<"$RUN")
          SOURCE_SHA=$(jq -r '.head_sha // ""' <<<"$RUN")
          [[ "$NAME" == "Downstream Windows + Linux + Android Release" ]]
          [[ "$CONCLUSION" == "failure" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "original_run_id=$EVENT_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          ARTIFACTS=$(gh api "repos/$REPO/actions/runs/$EVENT_RUN_ID/artifacts?per_page=100" --jq '.artifacts')
          have() { jq -e --arg name "$1" '.[] | select(.name == $name and .expired == false)' <<<"$ARTIFACTS" >/dev/null; }

          if have downstream-windows && have downstream-linux && have downstream-android-build; then
            echo "All build artifacts exist; recover signing/publish without rebuilding."
            echo "recover=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$ATTEMPT" -lt 3 ]]; then
            echo "Build artifacts are incomplete; retrying only failed jobs (attempt $ATTEMPT)."
            gh api --method POST "repos/$REPO/actions/runs/$EVENT_RUN_ID/rerun-failed-jobs" >/dev/null
            exit 0
          fi

          gh label create "automation/agent-repair" --repo "$REPO" --color 5319E7 \
            --description "Fail-closed CI repair intake" --force >/dev/null 2>&1 || true
          TITLE="[automation] downstream release build failed after retries"
          BODY="Release run $EVENT_RUN_ID failed after $ATTEMPT attempts and did not produce all trusted build artifacts. Source: $SOURCE_SHA. The zero-touch issue sweep may delegate downstream-owned code failures to Copilot; release/signing policy itself remains protected from autonomous edits."
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "in:title $TITLE" --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY" >/dev/null
          else
            gh issue create --repo "$REPO" --title "$TITLE" --label "automation/agent-repair" --body "$BODY" >/dev/null
          fi

  android-sign:
    name: Recover Android signing from trusted build artifact
    needs: inspect
    if: needs.inspect.outputs.recover == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sign.outputs.version }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ORIGINAL_RUN_ID: ${{ needs.inspect.outputs.original_run_id }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      # Deliberately no repository checkout: secret-bearing signing job executes
      # only fixed workflow commands and Android/JDK tooling.
      - name: Download unsigned Android build from failed release
        shell: bash
        run: gh run download "$ORIGINAL_RUN_ID" --repo "$REPO" --name downstream-android-build --dir unsigned-input

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android build tools only
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: false
          packages: "build-tools;36.0.0"

      - id: sign
        name: Normalize keystore encoding, discover pinned identity and sign
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]] || { echo "::error::ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          [[ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]] || { echo "::error::ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          EXPECTED_CERT_SHA256="BCAF88ACDB9F176CEE66C5350BB75107365EB65C40CED83A6BAAA930C4473A88"
          KEYSTORE="$RUNNER_TEMP/kumone-release.jks"

          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path

          raw = os.environ["ANDROID_KEYSTORE_BASE64"].strip()
          if raw.startswith("data:") and "," in raw:
              raw = raw.split(",", 1)[1]
          raw = raw.strip().strip("\"'")
          raw = re.sub(r"\s+", "", raw).replace("-", "+").replace("_", "/")
          raw += "=" * (-len(raw) % 4)
          try:
              data = base64.b64decode(raw, validate=False)
          except Exception as exc:
              raise SystemExit(f"Could not decode Android keystore: {exc}")
          if not data:
              raise SystemExit("Decoded Android keystore is empty")
          Path(os.environ["RUNNER_TEMP"]).joinpath("kumone-release.jks").write_bytes(data)
          PY

          # The stable security identity is the signing certificate, not the
          # byte serialization of the JKS container. Re-exports and base64
          # formatting changes therefore self-heal while key substitution fails.
          export LC_ALL=C
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-}"
          fingerprint_for() {
            local alias="$1"
            keytool -list -v -storetype JKS -keystore "$KEYSTORE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$alias" 2>/dev/null \
              | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 \
              | tr -d ':' | tr '[:lower:]' '[:upper:]'
          }

          MATCHED_ALIAS=""
          if [[ -n "$KEY_ALIAS" ]]; then
            fp=$(fingerprint_for "$KEY_ALIAS" || true)
            [[ "$fp" == "$EXPECTED_CERT_SHA256" ]] && MATCHED_ALIAS="$KEY_ALIAS"
          fi
          if [[ -z "$MATCHED_ALIAS" ]]; then
            while IFS= read -r alias; do
              [[ -n "$alias" ]] || continue
              fp=$(fingerprint_for "$alias" || true)
              if [[ "$fp" == "$EXPECTED_CERT_SHA256" ]]; then
                MATCHED_ALIAS="$alias"
                break
              fi
            done < <(keytool -list -v -storetype JKS -keystore "$KEYSTORE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p')
          fi
          [[ -n "$MATCHED_ALIAS" ]] || {
            echo "::error::No private-key alias matches the pinned Android certificate identity"
            exit 1
          }

          APK_IN=$(find unsigned-input -name 'Kumone-*-android-unsigned.apk' -type f -print -quit)
          AAB_IN=$(find unsigned-input -name 'Kumone-*-android-unsigned.aab' -type f -print -quit)
          [[ -n "$APK_IN" && -n "$AAB_IN" ]]
          VERSION=$(basename "$APK_IN" | sed -nE 's/^Kumone-([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)-android-unsigned\.apk$/\1/p')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"

          mkdir -p release-android
          APK_OUT="release-android/Kumone-$VERSION-android.apk"
          AAB_OUT="release-android/Kumone-$VERSION-android.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$MATCHED_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "$APK_OUT" "$APK_IN"
          cp "$AAB_IN" "$RUNNER_TEMP/kumone-unsigned.aab"
          zip -q -d "$RUNNER_TEMP/kumone-unsigned.aab" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
          jarsigner -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -signedjar "$AAB_OUT" "$RUNNER_TEMP/kumone-unsigned.aab" "$MATCHED_ALIAS" >/dev/null
          "$APKSIGNER" verify --verbose --print-certs "$APK_OUT" >/dev/null
          jarsigner -verify "$AAB_OUT" >/dev/null
          actual=$($APKSIGNER verify --print-certs "$APK_OUT" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          [[ "$actual" == "$EXPECTED_CERT_SHA256" ]]
          unzip -l "$APK_OUT" | grep -F "lib/arm64-v8a/libkumone_ffi.so"
          BYTES=$(stat -c%s "$APK_OUT")
          [[ "$BYTES" -le $((15 * 1024 * 1024)) ]]
          (cd release-android && sha256sum *.apk *.aab > SHA256SUMS-android)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Attest recovered signed Android provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            release-android/*.apk
            release-android/*.aab

      - name: Store recovered Android assets
        uses: actions/upload-artifact@v7
        with:
          name: downstream-android-recovered
          path: release-android/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish recovered stable release
    needs: [inspect, android-sign]
    if: needs.inspect.outputs.recover == 'true' && needs.android-sign.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      ORIGINAL_RUN_ID: ${{ needs.inspect.outputs.original_run_id }}
      SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
      VERSION: ${{ needs.android-sign.outputs.version }}
      TAURI_UPDATER_PUBLIC_KEY_ID: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY_ID }}
      TAURI_UPDATER_SIGNATURE_WINDOWS_X64: ${{ secrets.TAURI_UPDATER_SIGNATURE_WINDOWS_X64 }}
      TAURI_UPDATER_SIGNATURE_LINUX_X86_64: ${{ secrets.TAURI_UPDATER_SIGNATURE_LINUX_X86_64 }}
      TAURI_UPDATER_SIGNATURE_ANDROID: ${{ secrets.TAURI_UPDATER_SIGNATURE_ANDROID }}
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.inspect.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Revalidate stable version and source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          SOURCE_VERSION=$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' CHANGELOG.md | head -n 1)
          [[ "$SOURCE_VERSION" == "$VERSION" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Download trusted original Windows and Linux assets
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$ORIGINAL_RUN_ID" --repo "$REPO" --name downstream-windows --dir publish-assets/windows
          gh run download "$ORIGINAL_RUN_ID" --repo "$REPO" --name downstream-linux --dir publish-assets/linux

      - name: Download recovered Android assets
        uses: actions/download-artifact@v8
        with:
          name: downstream-android-recovered
          path: publish-assets/android

      - name: Assemble and validate payload
        shell: bash
        run: |
          set -euo pipefail
          TAG="downstream-v$VERSION"
          mkdir -p publish-assets/final
          cp publish-assets/windows/* publish-assets/final/
          cp publish-assets/linux/* publish-assets/final/
          cp publish-assets/android/* publish-assets/final/
          (cd publish-assets/final && sha256sum Kumone-* > SHA256SUMS)
          UPDATE_ARGS=(
            --version "$VERSION"
            --channel stable
            --base-url "https://github.com/$REPO/releases/download/$TAG"
            --output publish-assets/final/latest.json
            --asset "windows-x64=publish-assets/final/Kumone-$VERSION-windows-x64-setup.exe"
            --asset "linux-x86_64=publish-assets/final/Kumone-$VERSION-linux-x86_64.AppImage"
            --asset "android=publish-assets/final/Kumone-$VERSION-android.apk"
          )
          [[ -n "${TAURI_UPDATER_PUBLIC_KEY_ID:-}" ]] && UPDATE_ARGS+=(--public-key-id "$TAURI_UPDATER_PUBLIC_KEY_ID")
          [[ -n "${TAURI_UPDATER_SIGNATURE_WINDOWS_X64:-}" ]] && UPDATE_ARGS+=(--signature "windows-x64=$TAURI_UPDATER_SIGNATURE_WINDOWS_X64")
          [[ -n "${TAURI_UPDATER_SIGNATURE_LINUX_X86_64:-}" ]] && UPDATE_ARGS+=(--signature "linux-x86_64=$TAURI_UPDATER_SIGNATURE_LINUX_X86_64")
          [[ -n "${TAURI_UPDATER_SIGNATURE_ANDROID:-}" ]] && UPDATE_ARGS+=(--signature "android=$TAURI_UPDATER_SIGNATURE_ANDROID")
          python3 scripts/ci/generate-update-manifest.py "${UPDATE_ARGS[@]}"
          python3 scripts/ci/validate-update-manifest.py publish-assets/final/latest.json publish-assets/final
          python3 scripts/ci/validate-contracts.py

      - name: Publish once, never overwrite another source
        shell: bash
        run: |
          set -euo pipefail
          TAG="downstream-v$VERSION"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            EXISTING=$(gh release view "$TAG" --repo "$REPO" --json targetCommitish --jq '.targetCommitish')
            [[ "$EXISTING" == "$SOURCE_SHA" ]] || {
              echo "::error::Existing release $TAG belongs to another source"
              exit 1
            }
            echo "Release $TAG already recovered successfully; no-op."
            exit 0
          fi
          TAG_SHA=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)
          [[ -z "$TAG_SHA" || "$TAG_SHA" == "$SOURCE_SHA" ]] || {
            echo "::error::Existing tag $TAG points to another source"
            exit 1
          }
          [[ -z "$TAG_SHA" ]] || { echo "::error::Tag exists without release; fail closed"; exit 1; }

          WINDOWS_STATUS=$(find publish-assets/windows -name 'WINDOWS-SIGNING-STATUS.md' -type f -print -quit)
          WINDOWS_STATUS_TEXT="Windows signing status not emitted"
          [[ -z "$WINDOWS_STATUS" ]] || WINDOWS_STATUS_TEXT=$(cat "$WINDOWS_STATUS")
          gh release create "$TAG" --repo "$REPO" --target "$SOURCE_SHA" \
            --title "Kumone v$VERSION — Windows + Linux + Android" \
            --notes "Automated zero-touch recovery for the upstream-aligned Kumone v$VERSION release. Trusted Windows/Linux build artifacts were reused from failed run $ORIGINAL_RUN_ID; Android was re-signed after robust keystore normalization and pinned certificate verification.\n\n$WINDOWS_STATUS_TEXT"
          gh release upload "$TAG" publish-assets/final/* --repo "$REPO"

          mkdir -p "$RUNNER_TEMP/release-status"
          jq -n --arg workflow "Zero-touch release recovery" \
            --argjson original_run_id "$ORIGINAL_RUN_ID" --arg status completed --arg conclusion success \
            --arg source_ref "$SOURCE_SHA" --arg version "$VERSION" --arg tag "$TAG" \
            --arg url "$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{workflow:$workflow,original_run_id:$original_run_id,status:$status,conclusion:$conclusion,source_ref:$source_ref,version:$version,tag:$tag,prerelease:false,url:$url,updated_at:$updated_at}' \
            > "$RUNNER_TEMP/release-status/release.json"
          for path in .github/release-status/release.json .github/release-status/active.json; do
            sha=$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)
            args=(--method PUT "repos/$REPO/contents/$path" -f message="ci(status): record recovered release $TAG" \
              -f content="$(base64 < "$RUNNER_TEMP/release-status/release.json")" -f branch=main)
            [[ -z "$sha" ]] || args+=( -f sha="$sha" )
            gh api "${args[@]}" >/dev/null
          done
