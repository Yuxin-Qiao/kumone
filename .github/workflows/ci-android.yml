name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "crates/**"
      - "tools/uniffi-bindgen/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    name: Android Compose + Media3 + Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (Node 24)
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install stable Android SDK and NDK
        shell: bash
        run: |
          bash scripts/ci/install-android-sdk.sh

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0 (Node 24)
        with:
          gradle-version: "9.5.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Setup Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Test shared Rust core and FFI
        run: cargo test -p kumone-core -p kumone-ffi --all-targets

      - name: Build host UniFFI library
        run: cargo build -p kumone-ffi --release

      - name: Generate Kotlin UniFFI bindings
        run: |
          rm -rf apps/android/app/build/generated/uniffi/kotlin
          mkdir -p apps/android/app/build/generated/uniffi/kotlin
          cargo run -p uniffi-bindgen -- generate \
            --library target/release/libkumone_ffi.so \
            --language kotlin \
            --out-dir apps/android/app/build/generated/uniffi/kotlin \
            --no-format
          echo "Generated UniFFI Kotlin namespace:"
          grep -R -m1 '^package ' apps/android/app/build/generated/uniffi/kotlin || true
          find apps/android/app/build/generated/uniffi/kotlin -type f -maxdepth 5 -print

      - name: Build arm64 Rust library for Android
        run: |
          rm -rf apps/android/app/build/generated/uniffi/jniLibs
          cargo ndk -t arm64-v8a \
            -o apps/android/app/build/generated/uniffi/jniLibs \
            build -p kumone-ffi --release
          test -f apps/android/app/build/generated/uniffi/jniLibs/arm64-v8a/libkumone_ffi.so

      - name: Android lint
        run: gradle -p apps/android :app:lintDebug

      - name: Android unit tests
        run: gradle -p apps/android :app:testDebugUnitTest

      - name: Build Android debug APK
        run: gradle -p apps/android :app:assembleDebug

      - name: Verify Rust core is packaged in APK
        run: |
          set -euo pipefail
          APK=$(find apps/android/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)
          test -n "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libkumone_ffi.so"

      - name: Build optimized Android APK for size guard
        run: |
          gradle -p apps/android :app:assembleRelease \
            -PkumoneVersion="0.0.0-ci" \
            -PkumoneVersionCode="${{ github.run_number }}"

      - name: Enforce Android package size budget
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find apps/android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)
          test -n "$APK"
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          {
            echo "### Android size guard"
            echo "- Optimized APK: **${MIB} MiB**"
            echo "- Hard budget: **15 MiB**"
            echo "- Stretch target: **10 MiB**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BYTES" -gt $((15 * 1024 * 1024)) ]; then
            echo "::error::Android optimized APK is ${MIB} MiB, above the 15 MiB hard budget"
            exit 1
          fi
          if [ "$BYTES" -gt $((10 * 1024 * 1024)) ]; then
            echo "::warning::Android optimized APK is ${MIB} MiB; still within hard budget but above the 10 MiB stretch target"
          fi

      - name: Upload Android debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kumone-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
