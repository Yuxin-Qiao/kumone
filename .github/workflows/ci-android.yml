name: Android CI

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "crates/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "crates/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    name: Android Compose + Media3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 37 SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test shared Rust core
        run: cargo test --manifest-path crates/kumone-core/Cargo.toml --all-targets

      - name: Android lint
        run: gradle -p apps/android :app:lintDebug

      - name: Android unit tests
        run: gradle -p apps/android :app:testDebugUnitTest

      - name: Build Android debug APK
        run: gradle -p apps/android :app:assembleDebug
