name: Semantic Upstream Sync

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/upstream-sync-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-upstream-sync
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare ownership-aware upstream candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
      target_branch: ${{ steps.sync.outputs.target_branch }}
      sync_branch: ${{ steps.sync.outputs.sync_branch }}
      candidate_sha: ${{ steps.sync.outputs.candidate_sha }}
      version: ${{ steps.sync.outputs.version }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      conflict_count: ${{ steps.sync.outputs.conflict_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Prepare semantic sync candidate
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REQUEST=.github/upstream-sync-request.json
          if [[ -f "$REQUEST" ]]; then
            TARGET_BRANCH=$(jq -r '.target_branch // "main"' "$REQUEST")
          else
            TARGET_BRANCH="main"
          fi
          [[ "$TARGET_BRANCH" == "main" ]] || {
            echo "::error::Semantic upstream sync targets main only; got $TARGET_BRANCH"
            exit 1
          }

          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "updated=false" >> "$GITHUB_OUTPUT"
          echo "conflict_count=0" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET_BRANCH"
          git remote add upstream https://github.com/missuo/kumone.git 2>/dev/null || \
            git remote set-url upstream https://github.com/missuo/kumone.git
          git fetch upstream main --tags --force
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          UPSTREAM_SHA=$(git rev-parse upstream/main)
          UPSTREAM_SHORT=${UPSTREAM_SHA:0:12}
          UPSTREAM_VERSION=$(git show upstream/main:CHANGELOG.md | \
            sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' | head -n 1)
          [[ -n "$UPSTREAM_VERSION" ]] || {
            echo "::error::Could not resolve upstream version from CHANGELOG.md"
            exit 1
          }
          [[ "$UPSTREAM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "::error::Unexpected upstream version: $UPSTREAM_VERSION"
            exit 1
          }
          echo "version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          MERGE_BASE=$(git merge-base HEAD upstream/main)
          if [[ "$UPSTREAM_SHA" == "$MERGE_BASE" ]]; then
            {
              echo "### Semantic upstream sync"
              echo "- Upstream: **v$UPSTREAM_VERSION** (\`$UPSTREAM_SHORT\`)"
              echo "- Result: already up to date"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SYNC_BRANCH="automation/upstream-v${UPSTREAM_VERSION}-${UPSTREAM_SHORT}"
          [[ "$SYNC_BRANCH" =~ ^automation/upstream-v[0-9A-Za-z._-]+$ ]] || {
            echo "::error::Unexpected sync branch: $SYNC_BRANCH"
            exit 1
          }
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

          EXISTING_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --base "$TARGET_BRANCH" --head "$SYNC_BRANCH" --json url \
            --jq '.[0].url // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            echo "Existing upstream automation PR: $EXISTING_PR" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git checkout -B "$SYNC_BRANCH" "origin/$TARGET_BRANCH"
          set +e
          git merge --no-commit --no-ff upstream/main
          MERGE_STATUS=$?
          set -e

          CONFLICT_COUNT=0
          if [[ "$MERGE_STATUS" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            CONFLICT_COUNT=${#conflicts[@]}
            [[ "$CONFLICT_COUNT" -gt 0 ]] || {
              git merge --abort || true
              echo "::error::Upstream merge failed without conflict paths"
              exit 1
            }

            for path in "${conflicts[@]}"; do
              case "$path" in
                Cargo.toml|Cargo.lock|rust-toolchain.toml|.github/dependabot.yml|.github/workflows/*|.github/ISSUE_TEMPLATE/*|.github/release-request.json|.github/upstream-sync-request.json|crates/*|tools/uniffi-bindgen/*|apps/windows/*|apps/android/*|contracts/*|docs/architecture/*|docs/release/*|docs/compatibility.md|scripts/ci/*|web/lib/tauri-bridge.js|web/test/smoke.js|README.md|README_CN.md|MAINTAINERS.md)
                  echo "downstream owns conflict: $path"
                  git checkout --ours -- "$path"
                  git add -- "$path"
                  ;;
                CHANGELOG.md|Package.swift|Package.resolved|.gitignore|Sources/Kumone/*|Sources/KumoneLauncher/*|AppIcon.icon/*|Scripts/*|ios/*|web/*)
                  echo "upstream owns conflict: $path"
                  git checkout --theirs -- "$path"
                  git add -- "$path"
                  ;;
                *)
                  echo "::error::Unclassified upstream conflict: $path"
                  git merge --abort || true
                  exit 1
                  ;;
              esac
            done
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          rm -rf windows
          rm -f .github/workflows/release.yml .github/workflows/build-windows.yml

          MERGED_VERSION=$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' CHANGELOG.md | head -n 1)
          [[ "$MERGED_VERSION" == "$UPSTREAM_VERSION" ]] || {
            echo "::error::Merged version $MERGED_VERSION != upstream $UPSTREAM_VERSION"
            exit 1
          }

          UPSTREAM_VERSION="$UPSTREAM_VERSION" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["UPSTREAM_VERSION"]

          cargo = Path("Cargo.toml")
          cargo_text = cargo.read_text(encoding="utf-8")
          cargo_text, n = re.subn(
              r'(?ms)(^\[workspace\.package\]\s*.*?^version\s*=\s*")[^"]+(")',
              rf'\g<1>{version}\g<2>',
              cargo_text,
              count=1,
          )
          if n != 1:
              raise SystemExit("Could not update [workspace.package] version in Cargo.toml")
          cargo.write_text(cargo_text, encoding="utf-8")

          tauri = Path("apps/windows/src-tauri/tauri.conf.json")
          tauri_text = tauri.read_text(encoding="utf-8")
          tauri_text, n = re.subn(
              r'(^\s*"version"\s*:\s*")[^"]+("\s*,?\s*$)',
              rf'\g<1>{version}\g<2>',
              tauri_text,
              count=1,
              flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit("Could not update Tauri version")
          tauri.write_text(tauri_text, encoding="utf-8")

          android = Path("apps/android/app/build.gradle.kts")
          android_text = android.read_text(encoding="utf-8")
          android_text, n = re.subn(
              r'(providers\.gradleProperty\("kumoneVersion"\)\.orElse\(")[^"]+("\))',
              rf'\g<1>{version}\g<2>',
              android_text,
              count=1,
          )
          if n != 1:
              raise SystemExit("Could not update Android default version")
          android.write_text(android_text, encoding="utf-8")
          PY

          git add -A
          git commit -m "chore(sync): prepare upstream v$UPSTREAM_VERSION compatibility candidate"
          CANDIDATE_SHA=$(git rev-parse HEAD)
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Candidate SHA is not immutable"
            exit 1
          }

          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
            git push --force-with-lease origin HEAD:"$SYNC_BRANCH"
          else
            git push origin HEAD:"$SYNC_BRANCH"
          fi

          REMOTE_SHA=$(git ls-remote origin "refs/heads/$SYNC_BRANCH" | awk '{print $1}')
          [[ "$REMOTE_SHA" == "$CANDIDATE_SHA" ]] || {
            echo "::error::Remote candidate SHA mismatch"
            exit 1
          }

          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "conflict_count=$CONFLICT_COUNT" >> "$GITHUB_OUTPUT"
          CHANGED_FILES=$(git diff --name-only "origin/$TARGET_BRANCH...HEAD" | wc -l | tr -d ' ')
          {
            echo "### Semantic upstream candidate prepared"
            echo "- Candidate: \`$SYNC_BRANCH\`"
            echo "- Upstream: **v$UPSTREAM_VERSION** (\`$UPSTREAM_SHORT\`)"
            echo "- Candidate commit: \`$CANDIDATE_SHA\`"
            echo "- Changed files: **$CHANGED_FILES**"
            echo "- Ownership-resolved conflicts: **$CONFLICT_COUNT**"
            echo "- Legacy Electron desktop layout: **removed automatically**"
            echo "- Downstream package versions: **synchronized automatically**"
            echo "- Candidate validation caches: **disabled**"
            echo "- Apple/iOS sources: **upstream-owned and untouched downstream**"
          } >> "$GITHUB_STEP_SUMMARY"

  core:
    name: Core + Web compatibility gate
    needs: prepare
    if: needs.prepare.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Checkout immutable candidate
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - name: Version consistency
        run: python3 scripts/ci/sync-downstream-version.py --check
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust and shared-contract tests
        run: cargo test --workspace --all-targets
      - name: Web/PWA smoke and shared-contract tests
        run: npm test --prefix web

  android:
    name: Android compatibility gate
    needs: prepare
    if: needs.prepare.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Checkout immutable candidate
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install pinned Android SDK and NDK
        run: bash scripts/ci/install-android-sdk.sh
      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.5.0"
          cache-disabled: true
      - name: Setup Android Rust target
        run: |
          rustup target add aarch64-linux-android
          cargo +stable install cargo-ndk --version 4.1.2 --locked
      - name: Verify shared Rust core and FFI
        run: cargo test -p kumone-core -p kumone-ffi --all-targets
      - name: Generate Kotlin bindings and arm64 Rust library
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p kumone-ffi --release
          rm -rf apps/android/app/build/generated/uniffi/kotlin apps/android/app/build/generated/uniffi/jniLibs
          mkdir -p apps/android/app/build/generated/uniffi/kotlin
          cargo run -p uniffi-bindgen -- generate --library target/release/libkumone_ffi.so \
            --language kotlin --out-dir apps/android/app/build/generated/uniffi/kotlin --no-format
          cargo ndk -t arm64-v8a -o apps/android/app/build/generated/uniffi/jniLibs \
            build -p kumone-ffi --release
          test -f apps/android/app/build/generated/uniffi/jniLibs/arm64-v8a/libkumone_ffi.so
      - name: Android lint, tests and optimized package
        run: |
          gradle -p apps/android :app:lintDebug :app:testDebugUnitTest :app:assembleRelease \
            -PkumoneVersion="${{ needs.prepare.outputs.version }}" \
            -PkumoneVersionCode="${{ github.run_number }}"
      - name: Enforce Android package budget
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find apps/android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)
          test -n "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libkumone_ffi.so"
          BYTES=$(stat -c%s "$APK")
          [ "$BYTES" -le $((15 * 1024 * 1024)) ] || {
            echo "::error::Android optimized APK exceeds 15 MiB"; exit 1;
          }

  windows:
    name: Windows Tauri compatibility gate
    needs: prepare
    if: needs.prepare.outputs.updated == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Checkout immutable candidate
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Shared gates
        run: |
          cargo test --manifest-path crates/kumone-core/Cargo.toml --all-targets
          npm test --prefix web
      - name: Check and clippy Tauri shell
        run: |
          cargo check --manifest-path apps/windows/src-tauri/Cargo.toml
          cargo clippy --manifest-path apps/windows/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build optimized Windows executable
        run: cargo build --release --manifest-path apps/windows/src-tauri/Cargo.toml
      - name: Enforce Windows binary size budget
        shell: pwsh
        run: |
          $path = "apps/windows/src-tauri/target/release/kumone-desktop.exe"
          if (-not (Test-Path $path)) { throw "Missing optimized Windows executable: $path" }
          if ((Get-Item $path).Length -gt 15MB) { throw "Windows executable exceeds 15 MiB" }

  linux:
    name: Linux Tauri compatibility gate
    needs: prepare
    if: needs.prepare.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Checkout immutable candidate
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf rpm wget
      - name: Shared and Tauri gates
        run: |
          cargo test --manifest-path crates/kumone-core/Cargo.toml --all-targets
          npm test --prefix web
          cargo check --manifest-path apps/windows/src-tauri/Cargo.toml
          cargo clippy --manifest-path apps/windows/src-tauri/Cargo.toml --all-targets -- -D warnings
          npm install --global @tauri-apps/cli@v2
      - name: Build Linux bundles
        working-directory: apps/windows
        run: tauri build --bundles appimage,deb,rpm
      - name: Enforce Linux package budget
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' pkg; do
            count=$((count + 1))
            bytes=$(stat -c%s "$pkg")
            [ "$bytes" -le $((25 * 1024 * 1024)) ] || {
              echo "::error::$(basename "$pkg") exceeds 25 MiB"; exit 1;
            }
          done < <(find apps/windows/src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0)
          [ "$count" -ge 3 ] || { echo "::error::Expected AppImage, deb and rpm"; exit 1; }

  propose:
    name: Open validated upstream Draft PR
    needs: [prepare, core, android, windows, linux]
    if: >-
      ${{ always() &&
          needs.prepare.outputs.updated == 'true' &&
          needs.core.result == 'success' &&
          needs.android.result == 'success' &&
          needs.windows.result == 'success' &&
          needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create compatibility-gated Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          SYNC_BRANCH: ${{ needs.prepare.outputs.sync_branch }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          CONFLICT_COUNT: ${{ needs.prepare.outputs.conflict_count }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_BRANCH" == "main" ]]
          [[ "$SYNC_BRANCH" =~ ^automation/upstream-v[0-9A-Za-z._-]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

          REMOTE_SHA=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$SYNC_BRANCH" | awk '{print $1}')
          [[ "$REMOTE_SHA" == "$CANDIDATE_SHA" ]] || {
            echo "::error::Validated candidate branch moved after gates"
            exit 1
          }

          EXISTING_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --base "$TARGET_BRANCH" --head "$SYNC_BRANCH" --json url --jq '.[0].url // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            echo "Existing upstream sync PR: $EXISTING_PR" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > /tmp/upstream-pr.md <<EOF
          ## Automated upstream compatibility report

          This PR integrates **missuo/kumone v$VERSION** into `main` without directly modifying `main`.

          - Upstream commit: \`$UPSTREAM_SHA\`
          - Validated candidate: \`$CANDIDATE_SHA\`
          - Ownership-resolved conflicts: **$CONFLICT_COUNT**
          - Core + Web shared-contract gate: **passed**
          - Android Compose + Rust gate: **passed**
          - Windows Tauri gate: **passed**
          - Linux Tauri AppImage/deb/rpm gate: **passed**
          - Downstream package versions: **synchronized automatically**
          - Legacy Electron desktop code: **removed automatically**
          - Candidate validation caches: **disabled**
          - Apple/iOS implementation: **upstream-owned; no downstream iOS work**
          - Validation workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Ambiguous merge conflicts fail closed. This PR is intentionally a **Draft** and is never auto-merged.
          EOF

          PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$TARGET_BRANCH" \
            --head "$SYNC_BRANCH" --title "chore(sync): integrate upstream v$VERSION" \
            --body-file /tmp/upstream-pr.md --draft)
          echo "Validated upstream PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
