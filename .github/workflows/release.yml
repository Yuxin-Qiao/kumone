name: Unified Multi-Platform Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag to publish (e.g. v0.1.9.1 or v0.2.0, leave blank to use current ref)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

env:
  APP_NAME: Kumone
  SPARKLE_VERSION: "2.9.5"

jobs:
  # =========================================================================
  # 1. macOS Native SwiftUI Client Build
  # =========================================================================
  build-macos:
    name: Build macOS (SwiftUI Native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(echo "$RAW_TAG" | sed -E 's/^(v|windows-v|linux-v)//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION=$(git describe --tags --match="v*" --abbrev=0 2>/dev/null | sed -E 's/^v//' || echo "0.2.0")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        run: |
          Scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md" 2>/dev/null || git log -1 --pretty=%B > "$RUNNER_TEMP/notes.md"
          Scripts/release-notes.sh "$VERSION" --html > "$RUNNER_TEMP/$APP_NAME-$VERSION.html" 2>/dev/null || true

      - name: Build macOS App
        run: |
          MARKETING_VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" \
            Scripts/build-app.sh release

      - name: Sign & Notarize (if Apple certificates available)
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ]; then
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            rm -f "$RUNNER_TEMP/cert.p12"

            APP=".build/app/$APP_NAME.app"
            FW="$APP/Contents/Frameworks/Sparkle.framework"
            codesign -f -o runtime --preserve-metadata=entitlements -s "$SIGN_IDENTITY" "$FW/Versions/B/XPCServices/Downloader.xpc" || true
            codesign -f -o runtime --preserve-metadata=entitlements -s "$SIGN_IDENTITY" "$FW/Versions/B/XPCServices/Installer.xpc" || true
            codesign -f -o runtime -s "$SIGN_IDENTITY" "$FW/Versions/B/Autoupdate" || true
            codesign -f -o runtime -s "$SIGN_IDENTITY" "$FW/Versions/B/Updater.app" || true
            codesign -f -o runtime -s "$SIGN_IDENTITY" "$FW" || true
            codesign -f -o runtime -s "$SIGN_IDENTITY" "$APP" || true

            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
              ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" --wait || true
              xcrun stapler staple "$APP" || true
            fi
          fi

      - name: Package macOS deliverables
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p dist-macos
          ditto -c -k --keepParent ".build/app/$APP_NAME.app" "dist-macos/$APP_NAME-$VERSION.zip"

          if [ -n "$SPARKLE_PRIVATE_KEY" ] && [ -f "$RUNNER_TEMP/$APP_NAME-$VERSION.html" ]; then
            curl -sL -o "$RUNNER_TEMP/sparkle.tar.xz" \
              "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
            mkdir -p "$RUNNER_TEMP/sparkle"
            tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
            printf '%s' "$SPARKLE_PRIVATE_KEY" | \
              "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
                --ed-key-file - \
                --embed-release-notes \
                --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/" \
                -o dist-macos/appcast.xml \
                dist-macos || true
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist-macos/
          if-no-files-found: ignore

  # =========================================================================
  # 2. Windows Client Build (NSIS Installer & Portable)
  # =========================================================================
  build-windows:
    name: Build Windows (Electron x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Derive version
        shell: pwsh
        run: |
          $raw = "${{ github.event.inputs.tag || github.ref_name }}"
          $ver = $raw -replace '^(v|windows-v|linux-v)', ''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "main" -or $ver -eq "master") {
            $ver = (git describe --tags --match="v*" --abbrev=0 2>$null) -replace '^v', ''
            if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.2.0" }
          }
          Write-Host "Building Windows version: $ver"
          node ../Scripts/sync-docs-version.js $ver

      - name: Install dependencies & Test
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Build NSIS installer
        run: npm run package:win

      - name: Prepare Windows deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Copy-Item dist-installer\Kumone-Setup-*-x64.exe dist-windows\
          Compress-Archive -Path dist-installer\win-unpacked\* -DestinationPath dist-windows\Kumone-win32-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: windows/dist-windows/

  # =========================================================================
  # 3. Linux Client Build (AppImage, Deb & Tarball)
  # =========================================================================
  build-linux:
    name: Build Linux (AppImage, Deb & Tarball)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Derive version
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(echo "$RAW_TAG" | sed -E 's/^(v|windows-v|linux-v)//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION=$(git describe --tags --match="v*" --abbrev=0 2>/dev/null | sed -E 's/^v//' || echo "0.2.0")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          node ../Scripts/sync-docs-version.js "$VERSION"

      - name: Install dependencies & Test
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Build Linux packages
        run: npm run package:linux

      - name: Prepare Linux deliverables
        run: |
          mkdir -p dist-linux
          find dist-installer/ -maxdepth 1 \( -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \) -exec cp {} dist-linux/ \;
          ls -la dist-linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: windows/dist-linux/

  # =========================================================================
  # 4. Web Build & Deployment (PWA & Docker)
  # =========================================================================
  build-web:
    name: Build & Deploy Web (PWA & Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Derive version & Update latest.json
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(echo "$RAW_TAG" | sed -E 's/^(v|windows-v|linux-v)//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION=$(git describe --tags --match="v*" --abbrev=0 2>/dev/null | sed -E 's/^v//' || echo "0.2.0")
          fi
          node Scripts/sync-docs-version.js "$VERSION"
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION || "0.2.0";
            const tag = "v" + version;
            const meta = {
              version: version,
              tag: tag,
              releaseUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${tag}`,
              updatedAt: new Date().toISOString(),
              downloads: {
                macos: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/Kumone-${version}.zip`,
                windows: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/Kumone-Setup-${version}-x64.exe`,
                windowsPortable: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/Kumone-win32-x64.zip`,
                linuxAppImage: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/Kumone-${version}-x86_64.AppImage`,
                linuxDeb: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/Kumone_${version}_amd64.deb`
              }
            };
            fs.writeFileSync("web/latest.json", JSON.stringify(meta, null, 2), "utf-8");
          '
        env:
          VERSION: ${{ env.VERSION }}

      - name: Setup Pages & Deploy
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Set up Docker Buildx & Push
        uses: docker/setup-buildx-action@v3
        continue-on-error: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
        continue-on-error: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
        continue-on-error: true

  # =========================================================================
  # 5. Publish Unified Multi-Platform Release (macOS, Windows, Linux, Web)
  # =========================================================================
  publish-unified-release:
    name: Publish Unified Multi-Platform Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux, build-web]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive target version and release tag
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(echo "$RAW_TAG" | sed -E 's/^(v|windows-v|linux-v)//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION=$(git describe --tags --match="v*" --abbrev=0 2>/dev/null | sed -E 's/^v//' || echo "0.2.0")
          fi
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Target Release: $TAG (Version: $VERSION)"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-deliverables

      - name: Consolidate deliverables
        run: |
          mkdir -p release-dist
          find all-deliverables/ -type f \( \
            -name "*.exe" -o \
            -name "*.zip" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.tar.gz" -o \
            -name "appcast.xml" \
          \) -exec cp {} release-dist/ \;
          echo "Collected deliverables for $TAG:"
          ls -lh release-dist/

      - name: Generate Unified Release Notes & Asset Table
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const version = process.env.VERSION || "0.2.0";
            const owner = process.env.GITHUB_REPOSITORY_OWNER || "Yuxin-Qiao";
            let body = `## 📦 全平台安装包下载 (Downloads)\n\n` +
              `| 平台 (Platform) | 安装包类型 (Package Type) | 文件名 (Filename) | 说明 (Notes) |\n` +
              `| :--- | :--- | :--- | :--- |\n` +
              `| 🍎 **macOS** | 原生应用压缩包 | \`Kumone-${version}.zip\` | macOS 15.0+ 原生 SwiftUI 构建 |\n` +
              `| 🪟 **Windows** | NSIS 安装程序 (推荐) | \`Kumone-Setup-${version}-x64.exe\` | 自动创建快捷方式与卸载程序 |\n` +
              `| 🪟 **Windows** | 免安装便携版 Zip | \`Kumone-win32-x64.zip\` | 解压即用 |\n` +
              `| 🐧 **Linux** | AppImage 通用包 | \`Kumone-${version}-x86_64.AppImage\` | \`chmod +x\` 即可直接运行 |\n` +
              `| 🐧 **Linux** | Debian / Ubuntu 安装包 | \`Kumone_${version}_amd64.deb\` | \`sudo dpkg -i\` 一键安装 |\n` +
              `| 🌐 **Web & PWA** | 在线网页版 / PWA (全端/移动端通用) | [在线体验](https://${owner}.github.io/kumone/) | 浏览器即开即用，支持 iOS / Android / 桌面一键安装到主屏幕 |\n\n---\n\n`;

            if (fs.existsSync("CHANGELOG.md")) {
              try {
                const notes = execSync(`Scripts/release-notes.sh "${version}"`, { encoding: "utf-8" });
                if (notes && notes.trim()) body += notes;
              } catch (_) {
                try {
                  const gitLog = execSync("git log -1 --pretty=%B", { encoding: "utf-8" });
                  body += gitLog;
                } catch (_) {}
              }
            }
            fs.writeFileSync("release_body.md", body, "utf-8");
          '

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Publishing unified release for tag $TAG..."
          # If release exists, upload files and update notes; otherwise create release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets and notes..."
            gh release upload "$TAG" release-dist/* --clobber
            gh release edit "$TAG" --title "Kumone $TAG (全平台统一发布)" --notes-file release_body.md
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release-dist/* \
              --title "Kumone $TAG (全平台统一发布)" \
              --notes-file release_body.md
          fi
          echo "🎉 Unified release published successfully!"
