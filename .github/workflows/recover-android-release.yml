name: Recover Signed Android Downstream Release

on:
  push:
    branches: [main]
    paths:
      - ".github/android-release-retry-request.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: recover-android-downstream-release
  cancel-in-progress: true

jobs:
  android:
    name: Build, verify, and publish signed Android assets
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout release control branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=.github/android-release-retry-request.json
          test -f "$REQUEST"
          SOURCE_REF=$(jq -r '.source_ref // "refactor/rust-core-windows-android"' "$REQUEST")
          VERSION=$(jq -r '.version // empty' "$REQUEST")
          PRERELEASE=$(jq -r '.prerelease // true' "$REQUEST")
          test -n "$VERSION"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source_ref }}
          fetch-depth: 0

      - name: Validate upstream-aligned version
        env:
          VERSION: ${{ steps.request.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION=$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' CHANGELOG.md | head -n 1)
          UPSTREAM_VERSION=$(curl -fsSL https://raw.githubusercontent.com/missuo/kumone/main/CHANGELOG.md | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' | head -n 1)
          echo "Source version: $SOURCE_VERSION"
          echo "Upstream version: $UPSTREAM_VERSION"
          echo "Requested version: $VERSION"
          [[ "$SOURCE_VERSION" == "$UPSTREAM_VERSION" ]]
          [[ "$VERSION" == "$UPSTREAM_VERSION" ]]

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install stable Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Android Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Verify shared Rust core and FFI
        run: cargo test -p kumone-core -p kumone-ffi --all-targets

      - name: Generate Kotlin UniFFI bindings
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p kumone-ffi --release
          rm -rf apps/android/app/build/generated/uniffi/kotlin
          mkdir -p apps/android/app/build/generated/uniffi/kotlin
          cargo run -p uniffi-bindgen -- generate \
            --library target/release/libkumone_ffi.so \
            --language kotlin \
            --out-dir apps/android/app/build/generated/uniffi/kotlin

      - name: Build arm64 Rust library for Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/android/app/build/generated/uniffi/jniLibs
          cargo ndk -t arm64-v8a \
            -o apps/android/app/build/generated/uniffi/jniLibs \
            build -p kumone-ffi --release
          test -f apps/android/app/build/generated/uniffi/jniLibs/arm64-v8a/libkumone_ffi.so

      - name: Normalize and verify pinned signing identity
        shell: bash
        run: bash scripts/ci/prepare-android-signing.sh

      - name: Build signed release APK and AAB
        env:
          VERSION: ${{ steps.request.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            :app:bundleRelease \
            -PkumoneVersion="$VERSION" \
            -PkumoneVersionCode="${{ github.run_number }}"

      - name: Verify APK signer, AAB signature, and packaged Rust core
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          AAB=apps/android/app/build/outputs/bundle/release/app-release.aab
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          EXPECTED_CERT_SHA256="BCAF88ACDB9F176CEE66C5350BB75107365EB65C40CED83A6BAAA930C4473A88"

          test -f "$APK"
          test -f "$AAB"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libkumone_ffi.so"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          [[ "$APK_CERT_SHA256" == "$EXPECTED_CERT_SHA256" ]]
          # Android app-signing certificates are intentionally self-signed identities.
          # Verify the AAB cryptographic signature without treating CA-chain warnings as failures.
          jarsigner -verify "$AAB"

      - name: Prepare Android release assets
        env:
          VERSION: ${{ steps.request.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-android
          cp apps/android/app/build/outputs/apk/release/app-release.apk "release-android/Kumone-$VERSION-android.apk"
          cp apps/android/app/build/outputs/bundle/release/app-release.aab "release-android/Kumone-$VERSION-android.aab"
          (cd release-android && sha256sum * > SHA256SUMS)
          ls -lh release-android

      - name: Enforce Android release size budget
        env:
          VERSION: ${{ steps.request.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          APK="release-android/Kumone-$VERSION-android.apk"
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          echo "Android APK: ${MIB} MiB"
          if [ "$BYTES" -gt $((15 * 1024 * 1024)) ]; then
            echo "::error::Android release APK is ${MIB} MiB, above the 15 MiB hard budget"
            exit 1
          fi
          if [ "$BYTES" -gt $((10 * 1024 * 1024)) ]; then
            echo "::warning::Android release APK is ${MIB} MiB; above the 10 MiB stretch target"
          fi

      - name: Attest Android APK and AAB provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release-android/*.apk
            release-android/*.aab

      - name: Upload Android assets to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.request.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="downstream-v$VERSION"
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" release-android/* --clobber

      - name: Finalize GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.request.outputs.version }}
          PRERELEASE: ${{ steps.request.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="downstream-v$VERSION"
          RELEASE_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not find draft or published release for tag $TAG"
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease="$PRERELEASE" >/dev/null
          echo "Published $TAG (prerelease=$PRERELEASE)" >> "$GITHUB_STEP_SUMMARY"
