name: Build Linux (AppImage & Deb)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: '发布到的 GitHub Release Tag (例如 v0.1.9.1 或 v0.2.0，为空则仅打包不发布)'
        required: false
        type: string
        default: ''

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Smoke test (crypto parity & logic)
        run: npm test

      - name: Build Linux packages (AppImage, Deb, tar.gz)
        run: npm run package:linux

      - name: List built packages
        run: ls -lh dist-installer/

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Kumone-Linux-AppImage
          path: windows/dist-installer/*.AppImage

      - name: Upload Deb package
        uses: actions/upload-artifact@v7
        with:
          name: Kumone-Linux-Deb
          path: windows/dist-installer/*.deb

      - name: Upload Tarball
        uses: actions/upload-artifact@v7
        with:
          name: Kumone-Linux-Tarball
          path: windows/dist-installer/*.tar.gz

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Publishing Linux deliverables to release: $TAG"
          find dist-installer/ -maxdepth 1 \( -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \) -type f | while read -r pkg; do
            echo "Uploading $pkg to release $TAG..."
            gh release upload "$TAG" "$pkg" --clobber || true
          done
