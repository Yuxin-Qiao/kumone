name: Linux Tauri CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/build-linux.yml"
      - "contracts/**"
      - "scripts/ci/validate-contracts.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tauri:
    name: Linux Tauri desktop packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            squashfs-tools \
            wget

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            .
            apps/windows/src-tauri

      - name: Test shared Rust core and Web/PWA
        run: |
          cargo test --workspace --all-targets
          npm test --prefix web
          python3 scripts/ci/validate-contracts.py

      - name: Check shared Tauri desktop shell
        run: |
          cargo check --manifest-path apps/windows/src-tauri/Cargo.toml
          cargo clippy --manifest-path apps/windows/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@v2

      - name: Build AppImage, deb and rpm
        working-directory: apps/windows
        run: tauri build --bundles appimage,deb,rpm

      - name: Enforce Linux package budgets and prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-linux
          count=0
          while IFS= read -r -d '' pkg; do
            count=$((count + 1))
            bytes=$(stat -c%s "$pkg")
            mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
            case "$pkg" in
              *.AppImage)
                limit_mib=80
                ;;
              *.deb|*.rpm)
                limit_mib=25
                ;;
              *)
                echo "::error::Unexpected Linux package format: $pkg"
                exit 1
                ;;
            esac
            echo "$(basename "$pkg"): ${mib} MiB (budget: ${limit_mib} MiB)"
            if [ "$bytes" -gt $((limit_mib * 1024 * 1024)) ]; then
              echo "::error::$(basename "$pkg") exceeds its ${limit_mib} MiB Linux package hard budget (${mib} MiB)"
              exit 1
            fi
            cp "$pkg" release-linux/
          done < <(find apps/windows/src-tauri/target/release/bundle \
            -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0)
          [ "$count" -ge 3 ] || { echo "::error::Expected AppImage, deb and rpm"; exit 1; }
          APPIMAGE=$(find apps/windows/src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)
          bash scripts/ci/report-appimage-size.sh "$APPIMAGE" "$GITHUB_STEP_SUMMARY"
          (cd release-linux && sha256sum * > SHA256SUMS-linux)
          ls -lh release-linux

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kumone-desktop-linux
          path: release-linux/
          if-no-files-found: error
          retention-days: 7
