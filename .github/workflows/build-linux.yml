name: Linux Tauri CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/build-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tauri:
    name: Linux Tauri desktop packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            .
            apps/windows/src-tauri

      - name: Test shared Rust core and Web/PWA
        run: |
          cargo test --workspace --all-targets
          npm test --prefix web

      - name: Check shared Tauri desktop shell
        run: |
          cargo check --manifest-path apps/windows/src-tauri/Cargo.toml
          cargo clippy --manifest-path apps/windows/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@v2

      - name: Build AppImage, deb and rpm
        working-directory: apps/windows
        run: tauri build --bundles appimage,deb,rpm

      - name: Enforce Linux package budget and prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-linux
          find apps/windows/src-tauri/target/release/bundle \
            -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -print0 | while IFS= read -r -d '' pkg; do
              bytes=$(stat -c%s "$pkg")
              mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
              echo "$(basename "$pkg"): ${mib} MiB"
              if [ "$bytes" -gt $((25 * 1024 * 1024)) ]; then
                echo "::error::$(basename "$pkg") exceeds the 25 MiB Linux package hard budget (${mib} MiB)"
                exit 1
              fi
              cp "$pkg" release-linux/
            done
          test -n "$(find release-linux -maxdepth 1 -type f -print -quit)"
          (cd release-linux && sha256sum * > SHA256SUMS-linux)
          ls -lh release-linux

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: kumone-desktop-linux
          path: release-linux/
          if-no-files-found: error
          retention-days: 7
