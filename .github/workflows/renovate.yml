name: Renovate dependency maintenance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'renovate.json'
      - '.github/workflows/renovate.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-dependency-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    name: Validate Renovate configuration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Strict Renovate config validation
        shell: bash
        run: npx --yes --package renovate@44.2.1 -- renovate-config-validator --strict

  renovate:
    name: Renovate
    if: github.event_name != 'pull_request' && github.repository == 'Yuxin-Qiao/kumone'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Run self-hosted Renovate
        uses: renovatebot/github-action@0a7b68676027570f113b1d6e7b69b231b56167ab # v46.2.3
        with:
          renovate-version: 44.2.1
          token: ${{ secrets.RELEASE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: Yuxin-Qiao/kumone
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: info
