name: Renovate dependency maintenance

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-dependency-maintenance
  cancel-in-progress: true

jobs:
  renovate:
    name: Renovate
    if: github.repository == 'Yuxin-Qiao/kumone'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout trusted configuration
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Run self-hosted Renovate
        uses: renovatebot/github-action@0a7b68676027570f113b1d6e7b69b231b56167ab # v46.2.3
        with:
          configurationFile: renovate.json
          renovate-version: 44.2.1
          token: ${{ secrets.RELEASE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: Yuxin-Qiao/kumone
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: info
