name: Update Repository Metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/repo-metadata-request.json"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update repository description
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DESCRIPTION=$(jq -r '.description' .github/repo-metadata-request.json)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" -f description="$DESCRIPTION" >/dev/null
          echo "Repository description updated." >> "$GITHUB_STEP_SUMMARY"
