name: RC1 Exact-Source Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/rc1-request.json"

permissions:
  contents: read

concurrency:
  group: rc1-exact-source-verification
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve RC1 source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      version: ${{ steps.request.outputs.version }}
      label: ${{ steps.request.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(jq -r '.source_ref' .github/rc1-request.json)
          VERSION=$(jq -r '.version' .github/rc1-request.json)
          LABEL=$(jq -r '.label // "rc.1"' .github/rc1-request.json)

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_ref must be a full commit SHA"
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "::error::invalid version"
            exit 1
          }
          [[ "$LABEL" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::invalid label"
            exit 1
          }

          git fetch --no-tags origin main
          git cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null || {
            echo "::error::source_ref is not a commit available in this repository"
            exit 1
          }
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "::error::RC1 source must already be part of main history"
            exit 1
          }

          SOURCE_VERSION=$(git show "$SOURCE_SHA:CHANGELOG.md" | \
            sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' | head -n 1)
          UPSTREAM_VERSION=$(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/missuo/kumone/main/CHANGELOG.md \
            | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' | head -n 1)
          [[ "$VERSION" == "$SOURCE_VERSION" ]] || {
            echo "::error::requested $VERSION != source $SOURCE_VERSION"
            exit 1
          }
          if [[ "$VERSION" != "$UPSTREAM_VERSION" ]]; then
            [[ "$LABEL" =~ ^rc[._-] ]] || {
              echo "::error::A source version behind upstream requires an explicit rc label"
              exit 1
            }
            LATEST_VERSION=$(printf '%s\n%s\n' "$VERSION" "$UPSTREAM_VERSION" | sort -V | tail -n 1)
            [[ "$LATEST_VERSION" == "$UPSTREAM_VERSION" ]] || {
              echo "::error::RC source $VERSION is newer than upstream $UPSTREAM_VERSION"
              exit 1
            }
            echo "::warning::Verifying historical source $VERSION as $LABEL while upstream is $UPSTREAM_VERSION"
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

          {
            echo "### RC1 exact-source verification"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Source trust: **main ancestor verified**"
            echo "- Version: **$VERSION**"
            echo "- Label: **$LABEL**"
            echo "- Version policy: **historical source allowed for explicit RC label; stable releases remain exact-upstream gated**"
            echo "- Build caches for exact-source jobs: **disabled**"
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: RC1 Windows NSIS
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Checkout verified main-history source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify shared gates
        run: |
          cargo test --workspace --all-targets
          npm test --prefix web
          python3 scripts/ci/validate-contracts.py
      - name: Build NSIS
        shell: pwsh
        run: |
          npm install --global @tauri-apps/cli@v2
          $configPath = "apps/windows/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = "${{ needs.prepare.outputs.version }}"
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8
          Push-Location apps/windows
          try { tauri build --bundles nsis } finally { Pop-Location }
      - name: Prepare Windows RC
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/windows/src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not produced" }
          if ($installer.Length -gt 15MB) { throw "NSIS installer exceeds 15 MiB" }
          New-Item -ItemType Directory -Force -Path rc-windows | Out-Null
          $out = "rc-windows/Kumone-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.label }}-windows-x64-setup.exe"
          Copy-Item $installer.FullName $out
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $out -Leaf)" | Set-Content rc-windows/SHA256SUMS-windows -Encoding ascii
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: rc-windows/*.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Kumone-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.label }}-windows
          path: rc-windows/
          if-no-files-found: error
          retention-days: 30

  android-sign:
    name: RC1 sign Android artifact in isolated job
    needs: [prepare, android]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      LABEL: ${{ needs.prepare.outputs.label }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      # No checkout and no repository scripts execute in this secret-bearing job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Kumone-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.label }}-android-build
          path: unsigned-input
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android build tools only
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: false
          packages: "build-tools;36.0.0"
      - name: Verify pinned identity and sign RC artifacts
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is required for a signed RC"; exit 1; }
          done
          EXPECTED_KEYSTORE_SHA256="679cd8d890491caa93c96e8672699e6083c228e1c5087309432442375c370d9b"
          EXPECTED_CERT_SHA256="BCAF88ACDB9F176CEE66C5350BB75107365EB65C40CED83A6BAAA930C4473A88"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-kumone-release}"
          KEYSTORE="$RUNNER_TEMP/kumone-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > "$KEYSTORE"
          [[ -s "$KEYSTORE" ]] || { echo "::error::Android keystore did not decode"; exit 1; }
          actual_keystore_sha256=$(sha256sum "$KEYSTORE" | awk '{print $1}')
          [[ "$actual_keystore_sha256" == "$EXPECTED_KEYSTORE_SHA256" ]] || { echo "::error::Android keystore bytes do not match pinned identity"; exit 1; }
          keytool -list -v -storetype JKS -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/keytool.txt" 2>&1 || { echo "::error::Android keystore password or alias is invalid"; exit 1; }
          actual_cert_sha256=$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/keytool.txt" | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          [[ "$actual_cert_sha256" == "$EXPECTED_CERT_SHA256" ]] || { echo "::error::Android certificate fingerprint does not match pinned identity"; exit 1; }
          APK_IN=$(find unsigned-input -name '*android-unsigned.apk' -type f -print -quit)
          AAB_IN=$(find unsigned-input -name '*android-unsigned.aab' -type f -print -quit)
          [[ -n "$APK_IN" && -n "$AAB_IN" ]] || { echo "::error::Unsigned RC Android artifact is missing"; exit 1; }
          mkdir -p rc-android
          APK_OUT="rc-android/Kumone-$VERSION-$LABEL-android.apk"
          AAB_OUT="rc-android/Kumone-$VERSION-$LABEL-android.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$ANDROID_KEY_PASSWORD" --out "$APK_OUT" "$APK_IN"
          cp "$AAB_IN" "$RUNNER_TEMP/rc-unsigned.aab"
          zip -q -d "$RUNNER_TEMP/rc-unsigned.aab" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
          jarsigner -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar "$AAB_OUT" "$RUNNER_TEMP/rc-unsigned.aab" "$KEY_ALIAS" >/dev/null
          "$APKSIGNER" verify --print-certs "$APK_OUT" >/dev/null
          jarsigner -verify "$AAB_OUT" >/dev/null
          unzip -l "$APK_OUT" | grep -F "lib/arm64-v8a/libkumone_ffi.so"
          [ "$(stat -c%s "$APK_OUT")" -le $((15 * 1024 * 1024)) ] || { echo "::error::RC Android APK exceeds 15 MiB"; exit 1; }
          (cd rc-android && sha256sum *.apk *.aab > SHA256SUMS-android)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            rc-android/*.apk
            rc-android/*.aab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Kumone-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.label }}-android
          path: rc-android/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: RC1 Linux AppImage + deb + rpm
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Checkout verified main-history source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf rpm squashfs-tools wget
      - name: Verify shared gates and build Linux packages
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets
          npm test --prefix web
          cargo clippy --manifest-path apps/windows/src-tauri/Cargo.toml --all-targets -- -D warnings
          python3 scripts/ci/validate-contracts.py
          npm install --global @tauri-apps/cli@v2
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("apps/windows/src-tauri/tauri.conf.json")
          text = p.read_text(encoding="utf-8")
          text, n = re.subn(
              r'(^\s*"version"\s*:\s*")[^"]+("\s*,?\s*$)',
              r'\g<1>${{ needs.prepare.outputs.version }}\g<2>',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit("Could not set Tauri version")
          p.write_text(text, encoding="utf-8")
          PY
          (cd apps/windows && tauri build --bundles appimage,deb,rpm)
      - name: Prepare Linux RC
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ needs.prepare.outputs.label }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc-linux
          copy_one() {
            local pattern="$1" output="$2" limit_mib="$3"
            local source bytes mib
            source=$(find apps/windows/src-tauri/target/release/bundle -type f -name "$pattern" -print -quit)
            test -n "$source" || { echo "::error::Missing $pattern"; exit 1; }
            bytes=$(stat -c%s "$source")
            mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
            echo "$(basename "$source"): ${mib} MiB (budget: ${limit_mib} MiB)"
            [ "$bytes" -le $((limit_mib * 1024 * 1024)) ] || {
              echo "::error::$pattern exceeds ${limit_mib} MiB (${mib} MiB)"
              exit 1
            }
            cp "$source" "rc-linux/$output"
          }
          copy_one '*.AppImage' "Kumone-$VERSION-$LABEL-linux-x86_64.AppImage" 80
          copy_one '*.deb' "Kumone-$VERSION-$LABEL-linux-x86_64.deb" 25
          copy_one '*.rpm' "Kumone-$VERSION-$LABEL-linux-x86_64.rpm" 25
          (cd rc-linux && sha256sum Kumone-* > SHA256SUMS-linux)
          bash scripts/ci/report-appimage-size.sh "$(find apps/windows/src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)" "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            rc-linux/*.AppImage
            rc-linux/*.deb
            rc-linux/*.rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Kumone-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.label }}-linux
          path: rc-linux/
          if-no-files-found: error
          retention-days: 30

  android:
    name: RC1 Android build APK + AAB
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      LABEL: ${{ needs.prepare.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Checkout verified main-history source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install Android SDK and NDK
        run: bash scripts/ci/install-android-sdk.sh
      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.5.0"
          cache-disabled: true
      - name: Create ephemeral build-only Android signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/rc-build.jks" \
            -storepass changeit -keypass changeit -alias build-only -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=Kumone RC build-only"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rc-build.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=changeit"
            echo "ANDROID_KEY_ALIAS=build-only"
            echo "ANDROID_KEY_PASSWORD=changeit"
          } >> "$GITHUB_ENV"
      - name: Setup Rust Android target
        run: |
          rustup target add aarch64-linux-android
          cargo +stable install cargo-ndk --version 4.1.2 --locked
      - name: Generate UniFFI and build Android release artifact
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p kumone-core -p kumone-ffi --all-targets
          python3 scripts/ci/validate-contracts.py
          cargo build -p kumone-ffi --release
          rm -rf apps/android/app/build/generated/uniffi/kotlin apps/android/app/build/generated/uniffi/jniLibs
          mkdir -p apps/android/app/build/generated/uniffi/kotlin
          cargo run -p uniffi-bindgen -- generate --library target/release/libkumone_ffi.so \
            --language kotlin --out-dir apps/android/app/build/generated/uniffi/kotlin --no-format
          cargo ndk -t arm64-v8a -o apps/android/app/build/generated/uniffi/jniLibs \
            build -p kumone-ffi --release
          gradle -p apps/android :app:lintRelease :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease \
            -PkumoneVersion="$VERSION" -PkumoneVersionCode="${{ github.run_number }}"
      - name: Verify and prepare unsigned Android RC artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          AAB=apps/android/app/build/outputs/bundle/release/app-release.aab
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libkumone_ffi.so"
          [ "$(stat -c%s "$APK")" -le $((15 * 1024 * 1024)) ] || {
            echo "::error::Android APK exceeds 15 MiB"
            exit 1
          }
          mkdir -p rc-android-build
          cp "$APK" "rc-android-build/Kumone-$VERSION-$LABEL-android-unsigned.apk"
          cp "$AAB" "rc-android-build/Kumone-$VERSION-$LABEL-android-unsigned.aab"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Kumone-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.label }}-android-build
          path: rc-android-build/
          if-no-files-found: error
          retention-days: 30
