name: Build & Deploy Web (PWA & Docker)

on:
  push:
    branches: [main]
    tags: ["downstream-v*"]
  workflow_dispatch:

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Smoke test Web / PWA and shared contracts
        run: npm test --prefix web

      - name: Resolve latest published downstream release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^downstream-v[0-9]+\\.[0-9]+\\.[0-9]+(\\.[0-9]+)?$")))][0]' \
            > "$RUNNER_TEMP/downstream-release.json"
          test "$(jq -r '.tag_name // empty' "$RUNNER_TEMP/downstream-release.json")" != ""

      - name: Generate download metadata from real Release assets
        run: python3 scripts/ci/generate-web-release-metadata.py "$RUNNER_TEMP/downstream-release.json" web/latest.json

      - name: Verify latest.json points at the stable release
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg tag "$(jq -r '.tag_name' "$RUNNER_TEMP/downstream-release.json")" \
            '.tag == $tag and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+(\\.[0-9]+)?$")) and (.releaseUrl | startswith("https://github.com/"))' \
            web/latest.json >/dev/null
          echo "Verified Web/PWA latest.json against the latest stable downstream release." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit latest stable metadata back to main
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/downstream-v'))
        shell: bash
        run: |
          set -euo pipefail
          cp web/latest.json "$RUNNER_TEMP/latest.json"
          git fetch --no-tags origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/latest.json" web/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/latest.json
          if git diff --cached --quiet; then
            echo "web/latest.json already points at the stable release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "ci(web): update latest stable release metadata [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Committed web/latest.json for the stable downstream release." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Kumone-Web-PWA
          path: web/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        continue-on-error: true

  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
        continue-on-error: true
