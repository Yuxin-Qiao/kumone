name: Build & Deploy Web (PWA & Docker)

on:
  push:
    branches: [main, master]
    tags: ["v*", "web-v*"]
  workflow_dispatch:

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Smoke test Web / PWA
        run: node web/test/smoke.js

      - name: Generate static latest.json update metadata
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.2.0")
          VERSION=$(echo "$LATEST_TAG" | sed -E 's/^(v|windows-v|linux-v)//')
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION || "0.2.0";
            const tag = process.env.LATEST_TAG || "v0.2.0";
            const meta = {
              version: version,
              tag: tag,
              releaseUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${tag}`,
              updatedAt: new Date().toISOString(),
              downloads: {
                macos: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/Kumone-${version}.zip`,
                windows: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/Kumone-Setup-${version}-x64.exe`,
                linuxAppImage: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/Kumone-${version}-x86_64.AppImage`,
                linuxDeb: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/Kumone_${version}_amd64.deb`
              }
            };
            fs.writeFileSync("web/latest.json", JSON.stringify(meta, null, 2), "utf-8");
            console.log("Generated web/latest.json:", meta);
          '
        env:
          VERSION: ${{ env.VERSION }}
          LATEST_TAG: ${{ env.LATEST_TAG }}

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kumone-Web-PWA
          path: web/

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
        continue-on-error: true
