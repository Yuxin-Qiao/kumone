name: Upstream Boundary Regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/semantic-sync-upstream.yml'
      - '.github/workflows/upstream-boundary-regression.yml'
      - 'Scripts/ci/validate-upstream-candidate.py'
      - 'Scripts/ci/test-validate-upstream-candidate.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/semantic-sync-upstream.yml'
      - '.github/workflows/upstream-boundary-regression.yml'
      - 'Scripts/ci/validate-upstream-candidate.py'
      - 'Scripts/ci/test-validate-upstream-candidate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-boundary-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Verify upstream-owned Apple boundary
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run semantic boundary regression tests
        run: python3 Scripts/ci/test-validate-upstream-candidate.py
      - name: Verify workflow keeps upstream and downstream Apple deltas separate
        run: |
          set -euo pipefail
          grep -F 'UPSTREAM_APPLE_DELTA=$(git diff --name-only "$MERGE_BASE" "$UPSTREAM_SHA"' .github/workflows/semantic-sync-upstream.yml
          grep -F 'DOWNSTREAM_ADDED_APPLE_DELTA=$(git diff --name-only "$UPSTREAM_SHA" "$CANDIDATE_SHA"' .github/workflows/semantic-sync-upstream.yml
          ! grep -F 'git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA"' .github/workflows/semantic-sync-upstream.yml
          grep -F 'git checkout "$UPSTREAM_SHA" -- "$path"' .github/workflows/semantic-sync-upstream.yml
          grep -F 'git checkout --ours -- "$path"' .github/workflows/semantic-sync-upstream.yml
          git diff --check
