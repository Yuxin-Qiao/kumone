name: Upstream Maintenance Health

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Health is a monitor, not the transaction itself. Keeping a separate
  # group prevents its safe semantic-sync dispatch from cancelling the health
  # run that initiated it; the active-run check below still avoids duplicates.
  group: upstream-maintenance-health
  cancel-in-progress: true

jobs:
  health:
    name: Check and self-heal maintenance state
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: read
      issues: write
    steps:
      - name: Inspect live state and self-heal safe failures
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          ISSUE_TOKEN: ${{ github.token }}
          WORKFLOW_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          attention=0
          reasons=()
          active_sync=0
          main_sha=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
          upstream_sha=$(gh api "repos/missuo/kumone/commits/main" --jq '.sha')
          main_changelog=$(gh api "repos/$repo/contents/CHANGELOG.md?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)
          upstream_changelog=$(gh api "repos/missuo/kumone/contents/CHANGELOG.md?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)
          main_version=$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' <<< "$main_changelog" | head -n 1)
          upstream_version=$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' <<< "$upstream_changelog" | head -n 1)
          [[ -n "$main_version" && -n "$upstream_version" ]] || {
            attention=1; reasons+=("could not resolve main/upstream versions")
          }

          prs=$(gh api --paginate "repos/$repo/pulls?state=open&base=main&per_page=100")
          automation_prs=$(jq '[.[] | select(.head.ref | startswith("automation/upstream-"))]' <<< "$prs")
          pr_count=$(jq 'length' <<< "$automation_prs")
          candidate_sha=""
          stale_pr=0
          candidate_refresh=0
          if [[ "$pr_count" -gt 0 ]]; then
            candidate_sha=$(jq -r '.[0].head.sha' <<< "$automation_prs")
            while IFS= read -r pr; do
              base_sha=$(jq -r '.base.sha' <<< "$pr")
              body=$(jq -r '.body // ""' <<< "$pr")
              title=$(jq -r '.title // ""' <<< "$pr")
              if [[ "$base_sha" != "$main_sha" ]]; then
                stale_pr=1
                candidate_refresh=1
              fi
              # A candidate for an older upstream must not block a newer
              # upstream dispatch. The SHA and version are immutable PR
              # metadata, so this check is read-only and preserves manual PRs.
              if [[ -n "$upstream_sha" && "$body" != *"Upstream commit: `$upstream_sha`"* ]] ||
                 [[ -n "$upstream_version" && "$title" != *"upstream v$upstream_version"* ]]; then
                candidate_refresh=1
              fi
            done < <(jq -c '.[]' <<< "$automation_prs")
            if [[ "$pr_count" -gt 1 ]]; then
              stale_pr=1
              candidate_refresh=1
              reasons+=("more than one open automation upstream PR")
            fi
            if [[ "$stale_pr" -eq 1 ]]; then
              attention=1
              reasons+=("open automation candidate is not based on current main")
            fi
            if [[ "$candidate_refresh" -eq 1 && "$stale_pr" -eq 0 ]]; then
              attention=1
              reasons+=("open automation candidate is for an older upstream revision")
            fi
          fi

          # If upstream moved beyond the current package, rebuild when there
          # is no candidate or when the existing candidate is stale. A stale
          # base also needs rebuilding when the version string is unchanged
          # (for example, a patch commit or a main-only merge). A run already
          # in flight is left alone. The semantic transaction will close only
          # stale Draft PRs and preserve non-draft/manual work.
          upstream_ahead=0
          if [[ -n "$main_version" && -n "$upstream_version" && "$main_version" != "$upstream_version" && \
            "$(printf '%s\n%s\n' "$main_version" "$upstream_version" | sort -V | tail -n 1)" == "$upstream_version" ]]; then
            upstream_ahead=1
          fi
          if [[ "$candidate_refresh" -eq 1 || ( "$upstream_ahead" -eq 1 && "$pr_count" -eq 0 ) ]]; then
            active_sync=$(gh run list --workflow semantic-sync-upstream.yml --repo "$repo" \
              --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
            if [[ "$active_sync" -gt 0 ]]; then
              echo "Semantic sync is already active; no duplicate dispatch."
            else
              GH_TOKEN="$WORKFLOW_TOKEN" gh workflow run semantic-sync-upstream.yml --repo "$repo" --ref main
              active_sync=1
            fi
          fi

          # Main CI failures are safe to rerun because they execute the trusted
          # main ref and contain no release secrets. Persistent failures become
          # the single deduplicated maintenance issue below.
          for workflow in "Core CI" "Windows CI" "Android CI" "Linux Tauri CI" "CodeQL Security Scan"; do
            run=$(gh run list --workflow "$workflow" --repo "$repo" --branch main --limit 1 \
              --json databaseId,status,conclusion,headSha,url,displayTitle)
            status=$(jq -r '.[0].status // "missing"' <<< "$run")
            conclusion=$(jq -r '.[0].conclusion // ""' <<< "$run")
            if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
              attention=1
              reasons+=("$workflow latest main run concluded $conclusion")
              run_id=$(jq -r '.[0].databaseId // empty' <<< "$run")
              if [[ -n "$run_id" ]]; then
                GH_TOKEN="$WORKFLOW_TOKEN" gh run rerun "$run_id" --repo "$repo" --failed >/dev/null 2>&1 || true
              fi
            elif [[ "$status" == "missing" ]]; then
              attention=1
              reasons+=("$workflow has no recorded main run")
            fi
          done

          stable=$(gh api --paginate "repos/$repo/releases?per_page=100" --jq \
            '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^downstream-v[0-9]+\\.[0-9]+\\.[0-9]+(\\.[0-9]+)?$")))] | sort_by(.published_at) | reverse | .[0] // {}')
          stable_tag=$(jq -r '.tag_name // empty' <<< "$stable")
          status_content=$(gh api "repos/$repo/contents/.github/release-status/release.json?ref=main" --jq '.content' 2>/dev/null | tr -d '\n' | base64 --decode || true)
          if [[ -n "$status_content" && "$(jq -r '.conclusion // ""' <<< "$status_content")" == "failure" ]]; then
            attention=1
            reasons+=("latest downstream release workflow failed")
          fi
          status_tag=$(jq -r '.tag // empty' <<< "$status_content")
          status_prerelease=$(jq -r '.prerelease // ""' <<< "$status_content")
          # release.json records the latest release transaction, which may be
          # a successful RC while stable remains the published Web target.
          # Compare tags only for a stable transaction; RC status is valid and
          # must not create a false maintenance incident.
          if [[ -n "$stable_tag" && -n "$status_tag" && "$status_prerelease" != "true" && "$status_tag" != "$stable_tag" ]]; then
            attention=1
            reasons+=("release-status tag $status_tag does not match latest stable $stable_tag")
          fi

          # The committed Web/PWA metadata must identify the latest stable
          # downstream release, never an RC or a draft.
          if [[ -n "$stable_tag" ]]; then
            latest_content=$(gh api "repos/$repo/contents/web/latest.json?ref=main" --jq '.content' 2>/dev/null | tr -d '\n' | base64 --decode || true)
            if [[ "$(jq -r '.tag // empty' <<< "$latest_content")" != "$stable_tag" ]]; then
              attention=1
              reasons+=("web/latest.json does not point at $stable_tag")
              GH_TOKEN="$WORKFLOW_TOKEN" gh workflow run build-web.yml --repo "$repo" --ref main >/dev/null 2>&1 || true
            fi
          fi

          # Three consecutive failed semantic transactions are an explicit
          # human-intervention signal, not permission to merge around gates.
          recent_failures=$(gh run list --workflow semantic-sync-upstream.yml --repo "$repo" --limit 3 \
            --json conclusion --jq '[.[] | select(.conclusion == "failure")] | length')
          if [[ "$recent_failures" -ge 3 ]]; then
            attention=1
            reasons+=("three recent semantic sync transactions failed")
          fi

          issue_title="[automation] upstream maintenance needs attention"
          if [[ "$attention" -eq 1 ]]; then
            GH_TOKEN="$ISSUE_TOKEN" gh label create "automation/maintenance" --repo "$repo" --color F9D0C4 \
              --description "Automated maintenance incident" --force >/dev/null 2>&1 || true
            printf '%s\n' "## Automated maintenance health check" "" \
              "- Upstream version/SHA: \`$upstream_version\` / \`$upstream_sha\`" \
              "- Main version/SHA: \`$main_version\` / \`$main_sha\`" \
              "- Candidate SHA: \`${candidate_sha:-none}\`" \
              "- Observed conditions: **${reasons[*]}**" \
              "- Health run: $GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID" \
              "" "Self-healing was attempted where safe. The system remains fail-closed; no user bug was closed." \
              > "$RUNNER_TEMP/health-issue.md"
            automation_issues=$(GH_TOKEN="$ISSUE_TOKEN" gh api --paginate \
              "repos/$repo/issues?state=all&per_page=100" \
              --jq '.[] | select(.title == "[automation] upstream maintenance needs attention") | [.number, .state] | @tsv' \
              | sort -n -k1,1)
            canonical_issue=$(head -n 1 <<< "$automation_issues" | cut -f1)
            canonical_state=$(head -n 1 <<< "$automation_issues" | cut -f2)
            if [[ -n "$canonical_issue" ]]; then
              if [[ "$canonical_state" == "closed" ]]; then
                GH_TOKEN="$ISSUE_TOKEN" gh api --method PATCH "repos/$repo/issues/$canonical_issue" \
                  -f state=open >/dev/null
              fi
              while IFS=$'\t' read -r duplicate_issue duplicate_state; do
                [[ -z "$duplicate_issue" || "$duplicate_issue" == "$canonical_issue" ]] && continue
                if [[ "$duplicate_state" == "open" ]]; then
                  GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$duplicate_issue" --repo "$repo" \
                    --body "Superseded by canonical automation incident #$canonical_issue; retaining one maintenance Issue." >/dev/null
                  GH_TOKEN="$ISSUE_TOKEN" gh api --method PATCH "repos/$repo/issues/$duplicate_issue" \
                    -f state=closed >/dev/null
                fi
              done <<< "$automation_issues"
              GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$canonical_issue" --repo "$repo" \
                --body-file "$RUNNER_TEMP/health-issue.md" >/dev/null
            else
              GH_TOKEN="$ISSUE_TOKEN" gh issue create --repo "$repo" --title "$issue_title" \
                --label "automation/maintenance" \
                --body-file "$RUNNER_TEMP/health-issue.md" >/dev/null
            fi
            exit 0
          fi

          # Do not close an incident in the small window after this monitor
          # dispatches a semantic transaction. The transaction may still fail
          # closed and must be able to reopen the same canonical Issue.
          active_sync_now=$(gh run list --workflow semantic-sync-upstream.yml --repo "$repo" \
            --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [[ "$active_sync" -gt 0 || "$active_sync_now" -gt 0 ]]; then
            echo "Maintenance health: semantic sync is active; incident closure deferred." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Recovery closes only the automation-owned incident title. Real
          # user bug reports are never touched by this workflow.
          while IFS= read -r issue; do
            [[ -z "$issue" ]] && continue
            GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$issue" --repo "$repo" \
              --body "Health check recovered the upstream maintenance state; the automation incident is resolved." >/dev/null
            GH_TOKEN="$ISSUE_TOKEN" gh issue close "$issue" --repo "$repo" >/dev/null
          done < <(GH_TOKEN="$ISSUE_TOKEN" gh issue list --repo "$repo" --state open \
            --search '"[automation] upstream maintenance needs attention" in:title' \
            --json number --jq '.[].number')
          echo "Maintenance health: main=$main_sha upstream=$upstream_sha stable=${stable_tag:-none}; no outstanding automation incident." >> "$GITHUB_STEP_SUMMARY"
