name: Downstream Windows + Android Release

on:
  push:
    tags:
      - "downstream-v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch or tag to build"
        required: false
        type: string
        default: "main"
      version:
        description: "Upstream-aligned version (for example 0.2.3)"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: downstream-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows NSIS release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            apps/windows/src-tauri

      - name: Derive and validate upstream-aligned release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $requestedVersion = "${{ inputs.version }}".Trim()
          } else {
            $requestedVersion = "${{ github.ref_name }}" -replace '^downstream-v', ''
          }
          if ([string]::IsNullOrWhiteSpace($requestedVersion)) {
            throw "A release version is required"
          }

          $sourceChangelog = Get-Content "CHANGELOG.md" -Raw
          $sourceMatch = [regex]::Match(
            $sourceChangelog,
            '(?m)^##\s+([0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?)\s+-\s+'
          )
          if (-not $sourceMatch.Success) {
            throw "Could not resolve the source version from CHANGELOG.md"
          }
          $sourceVersion = $sourceMatch.Groups[1].Value

          $upstreamChangelog = (Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/missuo/kumone/main/CHANGELOG.md").Content
          $upstreamMatch = [regex]::Match(
            $upstreamChangelog,
            '(?m)^##\s+([0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?)\s+-\s+'
          )
          if (-not $upstreamMatch.Success) {
            throw "Could not resolve the latest upstream version"
          }
          $upstreamVersion = $upstreamMatch.Groups[1].Value

          "Source version: $sourceVersion"
          "Upstream version: $upstreamVersion"
          "Requested version: $requestedVersion"

          if ($sourceVersion -ne $upstreamVersion) {
            throw "Source ref is version $sourceVersion but upstream latest is $upstreamVersion. Sync upstream before releasing."
          }
          if ($requestedVersion -ne $upstreamVersion) {
            throw "Requested version $requestedVersion does not match upstream latest $upstreamVersion"
          }

          $version = $upstreamVersion
          $tag = "downstream-v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          "### Upstream version gate" >> $env:GITHUB_STEP_SUMMARY
          "- Source: **$sourceVersion**" >> $env:GITHUB_STEP_SUMMARY
          "- Upstream: **$upstreamVersion**" >> $env:GITHUB_STEP_SUMMARY
          "- Release: **$version**" >> $env:GITHUB_STEP_SUMMARY

          $configPath = "apps/windows/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8

      - name: Verify shared core and web behavior
        shell: pwsh
        run: |
          cargo test --workspace --all-targets
          npm test --prefix web

      - name: Build Windows installer into draft GitHub Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/windows
          tagName: downstream-v__VERSION__
          releaseName: "Kumone v__VERSION__ (Windows + Android downstream)"
          releaseBody: |
            Downstream Windows + Android build aligned to upstream Kumone v__VERSION__.

            - Windows: native Rust/Tauri 2 + system WebView2
            - Android: native Kotlin/Compose + Media3
            - Shared deterministic protocol logic: Rust kumone-core
            - Application version matches missuo/kumone upstream
          releaseDraft: true
          prerelease: true
          args: --bundles nsis

      - name: Enforce Windows installer size budget
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/windows/src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not produced" }
          $mib = [math]::Round($installer.Length / 1MB, 2)
          "### Windows release size" >> $env:GITHUB_STEP_SUMMARY
          "- NSIS installer: **$mib MiB**" >> $env:GITHUB_STEP_SUMMARY
          "- Stretch target: **10 MiB**" >> $env:GITHUB_STEP_SUMMARY
          "- Hard budget: **15 MiB**" >> $env:GITHUB_STEP_SUMMARY
          if ($installer.Length -gt 15MB) {
            throw "Windows NSIS installer is $mib MiB, above the 15 MiB hard budget"
          }
          if ($installer.Length -gt 10MB) {
            Write-Warning "Windows NSIS installer is $mib MiB; above the 10 MiB stretch target but within the 15 MiB hard budget"
          }

      - name: Attest Windows installer provenance
        uses: actions/attest@v4
        with:
          subject-path: apps/windows/src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Build signed Android APK + AAB
    runs-on: ubuntu-latest
    needs: windows
    env:
      VERSION: ${{ needs.windows.outputs.version }}
      TAG: ${{ needs.windows.outputs.tag }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install stable Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.5.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Setup Android Rust toolchain
        shell: bash
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Verify shared Rust core and FFI
        run: cargo test -p kumone-core -p kumone-ffi --all-targets

      - name: Generate Kotlin UniFFI bindings
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p kumone-ffi --release
          rm -rf apps/android/app/build/generated/uniffi/kotlin
          mkdir -p apps/android/app/build/generated/uniffi/kotlin
          cargo run -p uniffi-bindgen -- generate \
            --library target/release/libkumone_ffi.so \
            --language kotlin \
            --out-dir apps/android/app/build/generated/uniffi/kotlin

      - name: Build arm64 Rust library for Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/android/app/build/generated/uniffi/jniLibs
          cargo ndk -t arm64-v8a \
            -o apps/android/app/build/generated/uniffi/jniLibs \
            build -p kumone-ffi --release
          test -f apps/android/app/build/generated/uniffi/jniLibs/arm64-v8a/libkumone_ffi.so

      - name: Normalize and verify pinned signing identity
        shell: bash
        run: bash scripts/ci/prepare-android-signing.sh

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            :app:bundleRelease \
            -PkumoneVersion="$VERSION" \
            -PkumoneVersionCode="${{ github.run_number }}"

      - name: Verify APK signer, AAB signature, and packaged Rust core
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          AAB=apps/android/app/build/outputs/bundle/release/app-release.aab
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          EXPECTED_CERT_SHA256="BCAF88ACDB9F176CEE66C5350BB75107365EB65C40CED83A6BAAA930C4473A88"
          test -f "$APK"
          test -f "$AAB"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libkumone_ffi.so"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          [[ "$APK_CERT_SHA256" == "$EXPECTED_CERT_SHA256" ]]
          # Android app-signing certificates are intentionally self-signed identities.
          # Verify the AAB cryptographic signature without treating CA-chain warnings as failures.
          jarsigner -verify "$AAB"

      - name: Prepare Android release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-android
          cp apps/android/app/build/outputs/apk/release/app-release.apk \
            "release-android/Kumone-$VERSION-android.apk"
          cp apps/android/app/build/outputs/bundle/release/app-release.aab \
            "release-android/Kumone-$VERSION-android.aab"
          (cd release-android && sha256sum * > SHA256SUMS)
          ls -lh release-android

      - name: Enforce Android release size budget
        shell: bash
        run: |
          set -euo pipefail
          APK="release-android/Kumone-$VERSION-android.apk"
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          {
            echo "### Android release size"
            echo "- APK: **${MIB} MiB**"
            echo "- Hard budget: **15 MiB**"
            echo "- Stretch target: **10 MiB**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BYTES" -gt $((15 * 1024 * 1024)) ]; then
            echo "::error::Android release APK is ${MIB} MiB, above the 15 MiB hard budget"
            exit 1
          fi
          if [ "$BYTES" -gt $((10 * 1024 * 1024)) ]; then
            echo "::warning::Android release APK is ${MIB} MiB; above the 10 MiB stretch target"
          fi

      - name: Attest Android APK and AAB provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release-android/*.apk
            release-android/*.aab

      - name: Upload Android assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$TAG" release-android/* --clobber

      - name: Finalize GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PRERELEASE="${{ inputs.prerelease }}"
          else
            PRERELEASE="false"
          fi
          RELEASE_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not find draft or published release for tag $TAG"
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease="$PRERELEASE" >/dev/null
          echo "Published $TAG (prerelease=$PRERELEASE)" >> "$GITHUB_STEP_SUMMARY"
