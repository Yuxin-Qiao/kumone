name: Downstream Windows + Linux + Android Release

on:
  push:
    tags:
      - "downstream-v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Full main-history commit SHA to build"
        required: true
        type: string
      version:
        description: "Upstream-aligned app version (for example 0.2.5)"
        required: true
        type: string
      tag_suffix:
        description: "Optional downstream tag suffix such as rc.1"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Publish as a prerelease"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: downstream-release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve trusted release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        name: Validate trusted upstream-aligned source
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SOURCE_SHA="${{ inputs.source_ref }}"
            REQUESTED_VERSION="${{ inputs.version }}"
            TAG_SUFFIX="${{ inputs.tag_suffix }}"
            PRERELEASE="${{ inputs.prerelease }}"
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::workflow_dispatch source_ref must be a full commit SHA"
              exit 1
            }
          else
            [[ "$GITHUB_REF_NAME" == downstream-v* ]] || {
              echo "::error::Unexpected release tag: $GITHUB_REF_NAME"
              exit 1
            }
            git fetch origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            SOURCE_SHA=$(git rev-list -n 1 "$GITHUB_REF_NAME")
            RAW="${GITHUB_REF_NAME#downstream-v}"
            REQUESTED_VERSION="${RAW%%-*}"
            if [[ "$RAW" == *-* ]]; then TAG_SUFFIX="${RAW#*-}"; else TAG_SUFFIX=""; fi
            if [[ -n "$TAG_SUFFIX" ]]; then PRERELEASE="true"; else PRERELEASE="false"; fi
          fi

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Resolved source is not an immutable SHA"
            exit 1
          }
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "::error::Invalid version: $REQUESTED_VERSION"
            exit 1
          }
          [[ -z "$TAG_SUFFIX" || "$TAG_SUFFIX" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Invalid tag suffix: $TAG_SUFFIX"
            exit 1
          }
          [[ "$PRERELEASE" == "true" || "$PRERELEASE" == "false" ]] || {
            echo "::error::Invalid prerelease flag: $PRERELEASE"
            exit 1
          }

          git cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null || {
            echo "::error::Release source commit is not available in this repository"
            exit 1
          }
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "::error::Release source must already be part of main history"
            exit 1
          }

          git checkout --detach "$SOURCE_SHA"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

          python3 scripts/ci/sync-downstream-version.py --check

          SOURCE_VERSION=$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' CHANGELOG.md | head -n 1)
          UPSTREAM_VERSION=$(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/missuo/kumone/main/CHANGELOG.md \
            | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) - .*/\1/p' | head -n 1)

          [[ -n "$SOURCE_VERSION" && -n "$UPSTREAM_VERSION" ]] || {
            echo "::error::Could not resolve source/upstream version"
            exit 1
          }
          if [[ "$SOURCE_VERSION" != "$UPSTREAM_VERSION" ]]; then
            [[ "$PRERELEASE" == "true" && "$TAG_SUFFIX" =~ ^rc[._-] ]] || {
              echo "::error::A source version behind upstream requires prerelease=true and an explicit rc tag suffix"
              exit 1
            }
            LATEST_VERSION=$(printf '%s\n%s\n' "$SOURCE_VERSION" "$UPSTREAM_VERSION" | sort -V | tail -n 1)
            [[ "$LATEST_VERSION" == "$UPSTREAM_VERSION" ]] || {
              echo "::error::Source $SOURCE_VERSION is newer than upstream $UPSTREAM_VERSION"
              exit 1
            }
            echo "::warning::Building historical source $SOURCE_VERSION as prerelease $TAG_SUFFIX while upstream is $UPSTREAM_VERSION"
          fi
          [[ "$REQUESTED_VERSION" == "$SOURCE_VERSION" ]] || {
            echo "::error::Requested $REQUESTED_VERSION != source $SOURCE_VERSION"
            exit 1
          }

          TAG="downstream-v$REQUESTED_VERSION"
          [[ -z "$TAG_SUFFIX" ]] || TAG="$TAG-$TAG_SUFFIX"
          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "$TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag-derived metadata mismatch: $TAG != $GITHUB_REF_NAME"
            exit 1
          fi

          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          {
            echo "### Downstream release gate"
            echo "- Source version: **$SOURCE_VERSION**"
            echo "- Upstream version: **$UPSTREAM_VERSION**"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Source trust: **main ancestor verified**"
            echo "- Release tag: **$TAG**"
            echo "- Prerelease: **$PRERELEASE**"
            echo "- Version policy: **historical source allowed only for explicit rc prerelease; stable releases remain exact-upstream gated**"
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Build Windows NSIS
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    # This job deliberately has no signing secrets. It only builds an
    # unsigned artifact; the isolated windows-sign job handles the optional
    # certificate after the source code has finished executing.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Checkout verified release source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            .
            apps/windows/src-tauri
      - name: Automated shared-core and Web/PWA gates
        shell: pwsh
        run: |
          cargo test --workspace --all-targets
          npm test --prefix web
          python3 scripts/ci/validate-contracts.py
      - name: Install Tauri CLI
        shell: pwsh
        run: npm install --global @tauri-apps/cli@v2
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $configPath = "apps/windows/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = "${{ needs.prepare.outputs.version }}"
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8
          Push-Location apps/windows
          try { tauri build --bundles nsis } finally { Pop-Location }
      - name: Prepare Windows asset and enforce budget
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/windows/src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not produced" }
          $mib = [math]::Round($installer.Length / 1MB, 2)
          if ($installer.Length -gt 15MB) { throw "Windows installer exceeds 15 MiB hard budget ($mib MiB)" }
          New-Item -ItemType Directory -Force -Path release-windows-build | Out-Null
          $out = "release-windows-build/Kumone-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe"
          Copy-Item $installer.FullName $out
          "Windows NSIS: **$mib MiB**" >> $env:GITHUB_STEP_SUMMARY
      - name: Store unsigned Windows build
        uses: actions/upload-artifact@v7
        with:
          name: downstream-windows-build
          path: release-windows-build/
          if-no-files-found: error
          retention-days: 30

  windows-sign:
    name: Sign or explicitly mark Windows NSIS
    needs: [prepare, windows]
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      # No checkout and no repository scripts run in this secret-bearing job.
      - uses: actions/download-artifact@v8
        with:
          name: downstream-windows-build
          path: signed-input
      - name: Apply optional Authenticode signature and prepare final asset
        shell: pwsh
        run: |
          $installer = Get-ChildItem "signed-input" -Filter *.exe -Recurse | Select-Object -First 1
          if ($null -eq $installer) { throw "Unsigned Windows installer artifact is missing" }
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          $out = "release-windows/Kumone-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe"
          Copy-Item $installer.FullName $out
          $signed = $false
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -and
              -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            $pfx = Join-Path $env:RUNNER_TEMP "kumone-windows-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            try {
              $kits = ${env:ProgramFiles(x86)}
              $signtool = Get-ChildItem "$kits\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
              if ($null -eq $signtool) { throw "signtool.exe not found on runner" }
              & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $out
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
              & $signtool.FullName verify /pa /v $out
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed" }
              $signed = $true
            } finally {
              if (Test-Path $pfx) { Remove-Item $pfx -Force }
            }
          }
          if ($signed) {
            "Windows signing: **Authenticode verified**" | Set-Content release-windows/WINDOWS-SIGNING-STATUS.md -Encoding utf8
          } else {
            "Windows signing: **unsigned fallback** (Authenticode certificate secrets are not configured)" | Set-Content release-windows/WINDOWS-SIGNING-STATUS.md -Encoding utf8
          }
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $out -Leaf)" | Set-Content release-windows/SHA256SUMS-windows -Encoding ascii
      - name: Attest final Windows provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-windows/*.exe
      - name: Store final Windows release asset
        uses: actions/upload-artifact@v7
        with:
          name: downstream-windows
          path: release-windows/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Build Linux AppImage + deb + rpm
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Checkout verified release source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf rpm squashfs-tools wget
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            .
            apps/windows/src-tauri
      - name: Automated shared-core and Web/PWA gates
        run: |
          cargo test --workspace --all-targets
          npm test --prefix web
          cargo clippy --manifest-path apps/windows/src-tauri/Cargo.toml --all-targets -- -D warnings
          python3 scripts/ci/validate-contracts.py
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@v2
      - name: Build Linux packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("apps/windows/src-tauri/tauri.conf.json")
          text = p.read_text(encoding="utf-8")
          text, n = re.subn(
              r'(^\s*"version"\s*:\s*")[^"]+("\s*,?\s*$)',
              r'\g<1>${{ needs.prepare.outputs.version }}\g<2>',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit("Could not set Tauri version")
          p.write_text(text, encoding="utf-8")
          PY
          (cd apps/windows && tauri build --bundles appimage,deb,rpm)
      - name: Prepare Linux assets and enforce budgets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-linux
          copy_one() {
            local pattern="$1" output="$2" limit_mib="$3"
            local source
            source=$(find apps/windows/src-tauri/target/release/bundle -type f -name "$pattern" -print -quit)
            test -n "$source" || { echo "::error::Missing Linux bundle matching $pattern"; exit 1; }
            local bytes mib
            bytes=$(stat -c%s "$source")
            mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
            if [ "$bytes" -gt $((limit_mib * 1024 * 1024)) ]; then
              echo "::error::$pattern exceeds the ${limit_mib} MiB Linux hard budget (${mib} MiB)"
              exit 1
            fi
            cp "$source" "release-linux/$output"
            echo "Linux $output: **${mib} MiB** (budget: ${limit_mib} MiB)" >> "$GITHUB_STEP_SUMMARY"
          }
          copy_one '*.AppImage' "Kumone-$VERSION-linux-x86_64.AppImage" 80
          copy_one '*.deb' "Kumone-$VERSION-linux-x86_64.deb" 25
          copy_one '*.rpm' "Kumone-$VERSION-linux-x86_64.rpm" 25
          (cd release-linux && sha256sum Kumone-* > SHA256SUMS-linux)
          bash scripts/ci/report-appimage-size.sh "$(find apps/windows/src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)" "$GITHUB_STEP_SUMMARY"
      - name: Attest Linux provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            release-linux/*.AppImage
            release-linux/*.deb
            release-linux/*.rpm
      - name: Store Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: downstream-linux
          path: release-linux/
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build unsigned Android APK + AAB
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Checkout verified release source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install Android SDK and NDK
        shell: bash
        run: bash scripts/ci/install-android-sdk.sh
      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.5.0"
      - name: Create ephemeral build-only Android signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/unsigned-build.jks" \
            -storepass changeit -keypass changeit -alias build-only -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=Kumone build-only"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/unsigned-build.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=changeit"
            echo "ANDROID_KEY_ALIAS=build-only"
            echo "ANDROID_KEY_PASSWORD=changeit"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Setup Android Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          cargo +stable install cargo-ndk --version 4.1.2 --locked
      - name: Automated shared-core and FFI gates
        run: |
          cargo test -p kumone-core -p kumone-ffi --all-targets
          python3 scripts/ci/validate-contracts.py
      - name: Generate UniFFI Kotlin bindings and arm64 library
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p kumone-ffi --release
          rm -rf apps/android/app/build/generated/uniffi/kotlin
          mkdir -p apps/android/app/build/generated/uniffi/kotlin
          cargo run -p uniffi-bindgen -- generate \
            --library target/release/libkumone_ffi.so \
            --language kotlin \
            --out-dir apps/android/app/build/generated/uniffi/kotlin \
            --no-format
          rm -rf apps/android/app/build/generated/uniffi/jniLibs
          cargo ndk -t arm64-v8a \
            -o apps/android/app/build/generated/uniffi/jniLibs \
            build -p kumone-ffi --release
          test -f apps/android/app/build/generated/uniffi/jniLibs/arm64-v8a/libkumone_ffi.so
      - name: Build unsigned release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            :app:bundleRelease \
            -PkumoneVersion="$VERSION" \
            -PkumoneVersionCode="${{ github.run_number }}"
      - name: Verify Rust packaging and package budget
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          AAB=apps/android/app/build/outputs/bundle/release/app-release.aab
          test -f "$APK"
          test -f "$AAB"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libkumone_ffi.so"
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          if [ "$BYTES" -gt $((15 * 1024 * 1024)) ]; then
            echo "::error::Android APK exceeds 15 MiB hard budget (${MIB} MiB)"
            exit 1
          fi
          echo "Android APK: **${MIB} MiB**" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare unsigned Android build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-android-build
          cp apps/android/app/build/outputs/apk/release/app-release.apk "release-android-build/Kumone-$VERSION-android-unsigned.apk"
          cp apps/android/app/build/outputs/bundle/release/app-release.aab "release-android-build/Kumone-$VERSION-android-unsigned.aab"
      - name: Store unsigned Android build artifact
        uses: actions/upload-artifact@v7
        with:
          name: downstream-android-build
          path: release-android-build/
          if-no-files-found: error
          retention-days: 30

  android-sign:
    name: Sign Android APK + AAB in isolated job
    needs: [prepare, android]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      # No checkout and no repository code execute in this secret-bearing job.
      - uses: actions/download-artifact@v8
        with:
          name: downstream-android-build
          path: unsigned-input
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android build tools only
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: false
          packages: "build-tools;36.0.0"
      - name: Verify pinned signing identity and sign artifacts
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is required for a signed Android release"; exit 1; }
          done
          EXPECTED_KEYSTORE_SHA256="679cd8d890491caa93c96e8672699e6083c228e1c5087309432442375c370d9b"
          EXPECTED_CERT_SHA256="BCAF88ACDB9F176CEE66C5350BB75107365EB65C40CED83A6BAAA930C4473A88"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-kumone-release}"
          KEYSTORE="$RUNNER_TEMP/kumone-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > "$KEYSTORE"
          [[ -s "$KEYSTORE" ]] || { echo "::error::Android keystore did not decode"; exit 1; }
          actual_keystore_sha256=$(sha256sum "$KEYSTORE" | awk '{print $1}')
          [[ "$actual_keystore_sha256" == "$EXPECTED_KEYSTORE_SHA256" ]] || { echo "::error::Android keystore bytes do not match the pinned identity"; exit 1; }
          keytool -list -v -storetype JKS -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/keytool.txt" 2>&1 || {
            echo "::error::Android keystore password or alias is invalid"; exit 1;
          }
          actual_cert_sha256=$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/keytool.txt" | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          [[ "$actual_cert_sha256" == "$EXPECTED_CERT_SHA256" ]] || { echo "::error::Android certificate fingerprint does not match the pinned identity"; exit 1; }
          APK_IN=$(find unsigned-input -name '*android-unsigned.apk' -type f -print -quit)
          AAB_IN=$(find unsigned-input -name '*android-unsigned.aab' -type f -print -quit)
          [[ -n "$APK_IN" && -n "$AAB_IN" ]] || { echo "::error::Unsigned Android artifacts are missing"; exit 1; }
          mkdir -p release-android
          APK_OUT="release-android/Kumone-$VERSION-android.apk"
          AAB_OUT="release-android/Kumone-$VERSION-android.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$ANDROID_KEY_PASSWORD" --out "$APK_OUT" "$APK_IN"
          cp "$AAB_IN" "$RUNNER_TEMP/kumone-unsigned.aab"
          zip -q -d "$RUNNER_TEMP/kumone-unsigned.aab" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
          jarsigner -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar "$AAB_OUT" "$RUNNER_TEMP/kumone-unsigned.aab" "$KEY_ALIAS" >/dev/null
          "$APKSIGNER" verify --verbose --print-certs "$APK_OUT" >/dev/null
          jarsigner -verify "$AAB_OUT" >/dev/null
          unzip -l "$APK_OUT" | grep -F "lib/arm64-v8a/libkumone_ffi.so"
          BYTES=$(stat -c%s "$APK_OUT")
          [ "$BYTES" -le $((15 * 1024 * 1024)) ] || { echo "::error::Android APK exceeds 15 MiB"; exit 1; }
          (cd release-android && sha256sum *.apk *.aab > SHA256SUMS-android)
          echo "Android signing identity verified: $actual_cert_sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest signed Android provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            release-android/*.apk
            release-android/*.aab
      - name: Store signed Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: downstream-android
          path: release-android/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [prepare, windows-sign, linux, android-sign]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      TAURI_UPDATER_PUBLIC_KEY_ID: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY_ID }}
      TAURI_UPDATER_SIGNATURE_WINDOWS_X64: ${{ secrets.TAURI_UPDATER_SIGNATURE_WINDOWS_X64 }}
      TAURI_UPDATER_SIGNATURE_LINUX_X86_64: ${{ secrets.TAURI_UPDATER_SIGNATURE_LINUX_X86_64 }}
      TAURI_UPDATER_SIGNATURE_ANDROID: ${{ secrets.TAURI_UPDATER_SIGNATURE_ANDROID }}
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name downstream-windows --dir publish-assets/windows
      - name: Download Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name downstream-linux --dir publish-assets/linux
      - name: Download Android assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name downstream-android --dir publish-assets/android
      - name: Assemble release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-assets/final
          cp publish-assets/windows/* publish-assets/final/
          cp publish-assets/linux/* publish-assets/final/
          cp publish-assets/android/* publish-assets/final/
          (cd publish-assets/final && sha256sum Kumone-* > SHA256SUMS)
          CHANNEL=stable
          [[ "$PRERELEASE" == "true" ]] && CHANNEL=prerelease
          UPDATE_ARGS=(
            --version "$VERSION"
            --channel "$CHANNEL"
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
            --output publish-assets/final/latest.json
            --asset "windows-x64=publish-assets/final/Kumone-$VERSION-windows-x64-setup.exe"
            --asset "linux-x86_64=publish-assets/final/Kumone-$VERSION-linux-x86_64.AppImage"
            --asset "android=publish-assets/final/Kumone-$VERSION-android.apk"
          )
          [[ -n "${TAURI_UPDATER_PUBLIC_KEY_ID:-}" ]] && UPDATE_ARGS+=(--public-key-id "$TAURI_UPDATER_PUBLIC_KEY_ID")
          [[ -n "${TAURI_UPDATER_SIGNATURE_WINDOWS_X64:-}" ]] && UPDATE_ARGS+=(--signature "windows-x64=$TAURI_UPDATER_SIGNATURE_WINDOWS_X64")
          [[ -n "${TAURI_UPDATER_SIGNATURE_LINUX_X86_64:-}" ]] && UPDATE_ARGS+=(--signature "linux-x86_64=$TAURI_UPDATER_SIGNATURE_LINUX_X86_64")
          [[ -n "${TAURI_UPDATER_SIGNATURE_ANDROID:-}" ]] && UPDATE_ARGS+=(--signature "android=$TAURI_UPDATER_SIGNATURE_ANDROID")
          python3 scripts/ci/generate-update-manifest.py "${UPDATE_ARGS[@]}"
          python3 scripts/ci/validate-update-manifest.py publish-assets/final/latest.json publish-assets/final
          python3 scripts/ci/validate-contracts.py
          ls -lh publish-assets/final
      - name: Create or update release and publish automatically
        shell: bash
        run: |
          set -euo pipefail

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAG" =~ ^downstream-v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9._-]+)?$ ]]
          [[ "$PRERELEASE" == "true" || "$PRERELEASE" == "false" ]]

          TAG_LINES=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [[ -n "$TAG_LINES" ]]; then
            TAG_SHA=$(printf '%s\n' "$TAG_LINES" | awk '$2 ~ /\^\{\}$/ {print $1; exit}')
            if [[ -z "$TAG_SHA" ]]; then
              TAG_SHA=$(printf '%s\n' "$TAG_LINES" | awk 'NR == 1 {print $1}')
            fi
            [[ "$TAG_SHA" == "$SOURCE_SHA" ]] || {
              echo "::error::Existing tag $TAG points to $TAG_SHA, expected $SOURCE_SHA"
              exit 1
            }
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite an existing release"
            exit 1
          fi
          TAG_LINES=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [[ -n "$TAG_LINES" ]]; then
            echo "::error::Tag $TAG already exists; refusing to overwrite an existing tag"
            exit 1
          fi
          WINDOWS_STATUS=$(find publish-assets/windows -name 'WINDOWS-SIGNING-STATUS.md' -type f -print -quit)
          if [[ -n "$WINDOWS_STATUS" ]]; then
            WINDOWS_STATUS_TEXT=$(cat "$WINDOWS_STATUS")
          else
            WINDOWS_STATUS_TEXT="Windows signing status was not emitted by the signing gate"
          fi
          FLAGS=(--repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Kumone v$VERSION — Windows + Linux + Android")
          if [[ "$PRERELEASE" == "true" ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" "${FLAGS[@]}" --notes "Automated downstream release aligned with upstream Kumone v$VERSION. Windows, Linux and Android artifacts passed automated tests, package-size, update-manifest and provenance gates; Android is signed.\n\n$WINDOWS_STATUS_TEXT\n\nThe latest.json updater manifest is checksum-backed; automatic installation remains disabled until trusted updater signatures are configured. Android updates use the browser/system installer flow.\n\nReal-device compatibility is validated through structured community feedback after publication."

          gh release upload "$TAG" publish-assets/final/* --repo "$GITHUB_REPOSITORY"

          RELEASE_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          [[ -n "$RELEASE_ID" ]] || {
            echo "::error::Release $TAG not found after creation"
            exit 1
          }

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f name="Kumone v$VERSION — Windows + Linux + Android" \
            -F draft=false \
            -F prerelease="$PRERELEASE" >/dev/null

          # Persist the exact dispatch metadata. This avoids interpreting an
          # older manual release-request.json when workflow_run records status.
          mkdir -p "$RUNNER_TEMP/release-status"
          jq -n \
            --arg workflow "Downstream Windows + Linux + Android Release" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_number "$GITHUB_RUN_NUMBER" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg status "completed" \
            --arg conclusion "success" \
            --arg head_sha "$GITHUB_SHA" \
            --arg source_ref "$SOURCE_SHA" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --argjson prerelease "$PRERELEASE" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{workflow:$workflow,run_id:$run_id,run_number:$run_number,run_attempt:$run_attempt,status:$status,conclusion:$conclusion,head_sha:$head_sha,source_ref:$source_ref,version:$version,tag:$tag,prerelease:$prerelease,url:$url,updated_at:$updated_at}' \
            > "$RUNNER_TEMP/release-status/release.json"
          for path in .github/release-status/release.json .github/release-status/active.json; do
            file_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)
            args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message="ci(status): record downstream release $TAG" \
              -f content="$(base64 < "$RUNNER_TEMP/release-status/release.json")" -f branch=main)
            [[ -z "$file_sha" ]] || args+=( -f sha="$file_sha" )
            gh api "${args[@]}" >/dev/null
          done

          {
            echo "### Published"
            echo "- Release: **$TAG**"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Windows + Linux + Android assets uploaded"
            echo "- Existing tag/release overwrite: **refused**"
            echo "- No maintainer-side real-device gate"
          } >> "$GITHUB_STEP_SUMMARY"
