name: Repair Semantic Sync Metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-semantic-metadata-and-dispatch.yml'
      - 'Scripts/ci/repair-semantic-metadata-and-dispatch.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-semantic-sync-metadata
  cancel-in-progress: false

jobs:
  repair:
    name: Patch metadata and release dispatch
    if: github.repository == 'Yuxin-Qiao/kumone'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact repair
        run: |
          set -euo pipefail
          python3 Scripts/ci/repair-semantic-metadata-and-dispatch.py
          git diff --check
          grep -F 'GH_TOKEN="$ACTIONS_TOKEN" gh workflow run release-downstream.yml' .github/workflows/semantic-sync-upstream.yml
      - name: Commit repair and remove one-shot machinery
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-semantic-metadata-and-dispatch.yml
          rm -f Scripts/ci/repair-semantic-metadata-and-dispatch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Semantic sync metadata already repaired.'
          else
            git commit -m 'fix(ci): harden semantic sync metadata and release dispatch'
            AUTH_B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
            git -c http.extraheader="AUTHORIZATION: basic $AUTH_B64" push origin HEAD:main
          fi
      - name: Trigger fresh semantic sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run semantic-sync-upstream.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=live
