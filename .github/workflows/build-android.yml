name: Build Android (Native Kotlin APK)

on:
  push:
    branches: [main, master]
    tags: ["v*", "android-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: '发布到的 GitHub Release Tag (例如 v0.1.9 或 android-v0.1.9，为空则不发布到 Release)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # 清理标签前缀 v 或 android-v
          VERSION=$(echo "$RAW_TAG" | sed -E 's/^(android-)?v//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed -E 's/^(android-)?v//' || echo "0.1.9")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Android version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Android smoke tests (Crypto parity & structure)
        run: node android/test/smoke.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          chmod +x android/gradlew
          sed -i '/org.gradle.java.home/d' android/gradle.properties 2>/dev/null || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          ./gradlew assembleDebug assembleRelease -PversionName="$VERSION" --stacktrace

      - name: Prepare deliverables
        run: |
          mkdir -p dist-deliverables
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist-deliverables/Kumone-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist-deliverables/Kumone-${VERSION}-release-unsigned.apk"
          ls -lh dist-deliverables/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumone-Android-Debug
          path: dist-deliverables/Kumone-*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumone-Android-Release
          path: dist-deliverables/Kumone-*-release-unsigned.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Uploading Android APKs to release $TAG..."
          gh release upload "$TAG" dist-deliverables/*.apk --clobber || \
          gh release create "$TAG" dist-deliverables/*.apk --title "Kumone $TAG" --generate-notes
