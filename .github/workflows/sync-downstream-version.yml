name: Verify Candidate Normalization

on:
  push:
    branches:
      - "automation/upstream-v*"
    paths:
      - "CHANGELOG.md"
      - "Cargo.toml"
      - "apps/windows/**"
      - "apps/android/**"
      - "contracts/**"
      - "scripts/ci/**"
      - ".github/workflows/sync-downstream-version.yml"
  workflow_dispatch:

permissions:
  contents: read

# Candidate branches are immutable once gates begin. The semantic sync
# transaction performs normalization before it publishes the branch; this
# workflow is a read-only sentinel and can never move the candidate SHA.
concurrency:
  group: candidate-normalization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify downstream layout and versions without mutation
        run: |
          set -euo pipefail
          test ! -d windows
          test ! -e .github/workflows/release.yml
          test ! -e .github/workflows/build-windows.yml
          python3 scripts/ci/sync-downstream-version.py --check
          echo "Candidate normalization verified read-only; immutable SHA preserved." >> "$GITHUB_STEP_SUMMARY"
