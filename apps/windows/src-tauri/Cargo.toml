[package]
name = "kumone-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "kumone_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kumone-core = { path = "../../../crates/kumone-core" }
reqwest = "0.13.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
