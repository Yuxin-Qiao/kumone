<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#17171a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kumone">
  <title>Kumone — 雲の音 Web</title>
  
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    <!-- Top Header -->
    <header id="top-bar">
      <div class="brand-wrapper" id="btn-brand-home">
        <div class="brand-icon">く</div>
        <div class="brand-title">Kumone</div>
      </div>
      <div class="user-chip" id="btn-account">
        <img class="user-avatar" id="user-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2371717a'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Avatar">
        <span class="user-name" id="user-name">未登录</span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-scroll-view">
      <div id="view-container"></div>
    </main>

    <!-- Bottom Player Bar -->
    <div id="bottom-player-bar">
      <div class="bp-progress-bar">
        <div class="bp-progress-fill" id="bp-progress-fill"></div>
      </div>
      <img class="bp-cover" id="bp-cover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233f3f46'%3E%3Crect width='24' height='24'/%3E%3C/svg%3E" alt="Cover">
      <div class="bp-info" id="bp-info-area">
        <div class="bp-title" id="bp-title">雲の音</div>
        <div class="bp-artist" id="bp-artist">选择歌曲开始播放</div>
      </div>
      <div class="bp-controls">
        <button class="bp-btn" id="bp-btn-like" title="喜欢">♡</button>
        <button class="bp-btn bp-btn-play" id="bp-btn-play" title="播放/暂停">▶</button>
        <button class="bp-btn" id="bp-btn-next" title="下一首">⏭</button>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav id="bottom-nav">
      <div class="nav-tab active" data-tab="home">
        <div class="nav-tab-icon">🏠</div>
        <div>发现</div>
      </div>
      <div class="nav-tab" data-tab="search">
        <div class="nav-tab-icon">🔍</div>
        <div>搜索</div>
      </div>
      <div class="nav-tab" data-tab="fm">
        <div class="nav-tab-icon">📻</div>
        <div>私人 FM</div>
      </div>
      <div class="nav-tab" data-tab="library">
        <div class="nav-tab-icon">📚</div>
        <div>我的</div>
      </div>
      <div class="nav-tab" data-tab="settings">
        <div class="nav-tab-icon">⚙</div>
        <div>设置</div>
      </div>
    </nav>
  </div>

  <!-- Fullscreen Immersive Now Playing View -->
  <div id="fullscreen-player">
    <div class="fs-backdrop" id="fs-backdrop"></div>
    <div class="fs-overlay"></div>
    <div class="fs-content">
      <div class="fs-header">
        <button class="fs-btn-close" id="fs-btn-close">⌵</button>
        <div class="fs-header-info">
          <div class="fs-header-title" id="fs-title">正在播放</div>
          <div class="fs-header-artist" id="fs-artist">Kumone</div>
        </div>
        <button class="fs-btn-lyrics" id="fs-btn-lyrics-toggle" title="切换歌词">词</button>
      </div>

      <div class="fs-body" id="fs-body-area">
        <!-- Artwork View -->
        <div class="fs-artwork-container" id="fs-artwork-view">
          <img class="fs-artwork-img" id="fs-cover" src="" alt="Album Cover">
        </div>
        <!-- Lyrics View -->
        <div class="fs-lyrics-container" id="fs-lyrics-view">
          <div id="fs-lyrics-content"></div>
        </div>
      </div>

      <div class="fs-progress-wrapper">
        <input type="range" class="fs-seek-slider" id="fs-seek-slider" min="0" max="1000" value="0">
        <div class="fs-time-row">
          <span id="fs-time-cur">00:00</span>
          <span id="fs-time-dur">00:00</span>
        </div>
      </div>

      <div class="fs-controls-main">
        <button class="fs-btn-mode" id="fs-btn-mode" title="循环模式">🔁</button>
        <button class="fs-btn-prev" id="fs-btn-prev" title="上一首">⏮</button>
        <button class="fs-btn-play-pause" id="fs-btn-play" title="播放/暂停">▶</button>
        <button class="fs-btn-next" id="fs-btn-next" title="下一首">⏭</button>
        <button class="fs-btn-like" id="fs-btn-like" title="喜欢">♡</button>
      </div>

      <div class="fs-bottom-bar">
        <span class="fs-quality-badge" id="fs-quality-badge">标准音质</span>
        <button class="fs-btn-queue" id="fs-btn-queue" title="播放队列">☰</button>
      </div>
    </div>
  </div>

  <!-- Queue Bottom Sheet -->
  <div class="bottom-sheet-backdrop" id="queue-sheet-backdrop">
    <div class="bottom-sheet" id="queue-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span>播放队列 (<span id="queue-count">0</span>)</span>
        <button id="btn-clear-queue" style="background:none;border:none;color:var(--text-muted);font-size:12px;">清空</button>
      </div>
      <div class="track-list" id="queue-track-list"></div>
    </div>
  </div>

  <!-- Track Action Sheet (Menu) -->
  <div class="bottom-sheet-backdrop" id="action-sheet-backdrop">
    <div class="bottom-sheet" id="action-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span id="action-track-title">歌曲操作</span>
      </div>
      <div id="action-menu-items">
        <div class="sheet-menu-item" id="action-play-next">
          <span>➕</span><span>下一首播放</span>
        </div>
        <div class="sheet-menu-item" id="action-like">
          <span>❤️</span><span>收藏 / 取消喜欢</span>
        </div>
        <div class="sheet-menu-item" id="action-album">
          <span>💿</span><span>查看专辑</span>
        </div>
        <div class="sheet-menu-item" id="action-artist">
          <span>👤</span><span>查看歌手</span>
        </div>
        <div class="sheet-menu-item" id="action-simi">
          <span>✦</span><span>相似歌曲</span>
        </div>
        <div class="sheet-menu-item" id="action-copy-link">
          <span>🔗</span><span>复制歌曲链接</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Login Multi-Mode Modal -->
  <div class="bottom-sheet-backdrop" id="login-sheet-backdrop">
    <div class="bottom-sheet" id="login-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span>登录网易云音乐</span>
        <button id="btn-close-login" style="background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px 8px;">✕</button>
      </div>

      <!-- Login Type Switcher Tabs -->
      <div class="login-tabs">
        <button class="login-tab-btn active" data-login-tab="phone">📱 手机号登录</button>
        <button class="login-tab-btn" data-login-tab="qr">📷 扫码登录</button>
        <button class="login-tab-btn" data-login-tab="cookie">🔑 Cookie 登录</button>
      </div>

      <!-- Tab 1: Phone Login -->
      <div class="login-tab-content active" id="tab-login-phone">
        <div class="login-form">
          <div style="font-size:11.5px;color:var(--text-muted);background:var(--bg-app);padding:8px 10px;border-radius:var(--radius-sm);margin-bottom:10px;line-height:1.4">
            💡 若提示「网络存在安全风险」，推荐切换至上方 <b>「扫码登录」</b> 或 <b>「Cookie 登录」</b>，由官方 App 授权认证，免受机房 IP 风控限制。
          </div>
          <div class="login-input-group">
            <span class="input-prefix">+86</span>
            <input type="tel" id="input-login-phone" class="login-input" placeholder="请输入手机号码" maxlength="11">
          </div>

          <div class="login-sub-tabs">
            <label class="login-radio-label">
              <input type="radio" name="phone-auth-type" value="captcha" checked> 验证码登录
            </label>
            <label class="login-radio-label">
              <input type="radio" name="phone-auth-type" value="password"> 密码登录
            </label>
          </div>

          <!-- Captcha Row -->
          <div class="login-input-group" id="row-login-captcha">
            <input type="text" id="input-login-captcha" class="login-input" placeholder="请输入短信验证码" maxlength="8">
            <button class="btn btn-secondary" id="btn-send-captcha" type="button" style="white-space:nowrap;font-size:12px;padding:6px 12px;border-radius:16px;">获取验证码</button>
          </div>

          <!-- Password Row -->
          <div class="login-input-group" id="row-login-password" style="display:none;">
            <input type="password" id="input-login-password" class="login-input" placeholder="请输入网易云账号密码">
          </div>

          <button class="btn btn-primary btn-block" id="btn-submit-phone-login" type="button" style="margin-top:10px;padding:10px 0;font-size:14px;font-weight:600;">立即登录</button>
        </div>
      </div>

      <!-- Tab 2: QR Code / App Jump Login -->
      <div class="login-tab-content" id="tab-login-qr">
        <div class="qr-modal-body">
          <button class="btn btn-primary btn-block" id="btn-jump-netease-app" type="button" style="margin-bottom:14px;padding:10px 0;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;">
            <span>🚀</span><span>一键唤起网易云音乐 App 确认</span>
          </button>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">或使用另一台手机 App 扫码：</div>
          <div class="qr-image-wrapper">
            <img class="qr-image" id="login-qr-img" alt="QR Code">
          </div>
          <div class="qr-status-text" id="login-qr-status">正在生成二维码…</div>
          <button class="sheet-menu-item" id="btn-refresh-qr" style="justify-content:center;color:var(--primary);display:none;">点击刷新二维码</button>
        </div>
      </div>

      <!-- Tab 3: Cookie / MUSIC_U Login -->
      <div class="login-tab-content" id="tab-login-cookie">
        <div class="login-form">
          <div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;line-height:1.5;">
            粘贴网易云音乐的 <code>MUSIC_U</code> 字段值或完整 Cookie 字符串：
          </div>
          <textarea id="input-login-cookie" class="login-textarea" rows="3" placeholder="例如：MUSIC_U=0079a4... 或直接粘贴完整 Cookie"></textarea>
          <button class="btn btn-primary btn-block" id="btn-submit-cookie-login" type="button" style="margin-top:10px;padding:10px 0;font-size:14px;font-weight:600;">导入并登录</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="lib/qrcode.min.js"></script>
  <script src="lib/crypto.js"></script>
  <script src="lib/client.js"></script>
  <script src="lib/api.js"></script>
  <script src="lib/unblock.js"></script>
  <script src="app.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
