coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

flags:
  rust-core:
    paths:
      - crates/
    carryforward: false

ignore:
  - "Sources/Kumone/**"
  - "Sources/KumoneLauncher/**"
  - "ios/**"
